<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🏠 임장 히스토리</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;900&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Noto Sans KR', sans-serif; background: #f0f4f9; color: #1e293b; -webkit-font-smoothing: antialiased; }
    input, textarea, select, button { font-family: 'Noto Sans KR', sans-serif; }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    @keyframes fadeUp { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
    @keyframes shake  { 0%,100%{transform:translateX(0)} 20%,60%{transform:translateX(-8px)} 40%,80%{transform:translateX(8px)} }
    .fade-up { animation: fadeUp 0.3s ease both; }
    .btn-primary   { background:#1d4ed8; color:#fff; border:none; border-radius:8px; padding:10px 20px; cursor:pointer; font-weight:600; font-size:14px; transition:background .2s; }
    .btn-primary:hover { background:#1e40af; }
    .btn-secondary { background:#f1f5f9; color:#475569; border:1px solid #e2e8f0; border-radius:8px; padding:10px 20px; cursor:pointer; font-weight:500; font-size:14px; transition:all .2s; }
    .btn-secondary:hover { background:#e2e8f0; }
    .btn-danger    { background:#fee2e2; color:#dc2626; border:1px solid #fecaca; border-radius:8px; padding:10px 20px; cursor:pointer; font-weight:500; font-size:14px; }
    .btn-danger:hover { background:#fecaca; }
    .btn-icon { background:transparent; border:none; cursor:pointer; padding:6px; border-radius:6px; display:flex; align-items:center; justify-content:center; transition:background .2s; color:#64748b; font-size:16px; line-height:1; }
    .btn-icon:hover { background:#f1f5f9; }
    .input-field { width:100%; border:1.5px solid #e2e8f0; border-radius:8px; padding:10px 14px; font-size:14px; color:#1e293b; background:#fff; transition:border-color .2s,box-shadow .2s; outline:none; }
    .input-field:focus { border-color:#3b82f6; box-shadow:0 0 0 3px rgba(59,130,246,.12); }
    .textarea-field { width:100%; border:1.5px solid #e2e8f0; border-radius:8px; padding:10px 14px; font-size:14px; color:#1e293b; background:#fff; outline:none; resize:vertical; min-height:100px; line-height:1.7; }
    .textarea-field:focus { border-color:#3b82f6; box-shadow:0 0 0 3px rgba(59,130,246,.12); }
    .card { background:#fff; border-radius:14px; box-shadow:0 1px 4px rgba(0,0,0,.07),0 1px 2px rgba(0,0,0,.05); transition:box-shadow .2s; }
    .prop-card { cursor:pointer; transition:transform .2s,box-shadow .2s; }
    .prop-card:hover { transform:translateY(-3px); box-shadow:0 10px 28px rgba(0,0,0,.13); }
    .tag { display:inline-flex; align-items:center; gap:4px; padding:3px 9px; border-radius:20px; font-size:12px; font-weight:500; }
    .tag-blue   { background:#dbeafe; color:#1d4ed8; }
    .tag-green  { background:#dcfce7; color:#16a34a; }
    .tag-orange { background:#ffedd5; color:#ea580c; }
    .tag-gray   { background:#f1f5f9; color:#475569; }
    .sidebar-link { display:flex; align-items:center; gap:10px; padding:10px 14px; border-radius:8px; cursor:pointer; color:#94a3b8; font-size:14px; font-weight:500; border:none; background:transparent; width:100%; text-align:left; transition:all .2s; }
    .sidebar-link:hover { background:rgba(255,255,255,.08); color:#fff; }
    .sidebar-link.active { background:rgba(59,130,246,.18); color:#60a5fa; }
    .section-label { font-size:11px; font-weight:700; color:#94a3b8; text-transform:uppercase; letter-spacing:.08em; margin-bottom:14px; padding-bottom:8px; border-bottom:1px solid #f1f5f9; }
    .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.5); display:flex; align-items:center; justify-content:center; z-index:1000; }
    .modal-box { background:#fff; border-radius:18px; padding:32px; width:90%; max-width:380px; box-shadow:0 24px 64px rgba(0,0,0,.25); animation:fadeUp .25s ease; }
    .firebase-badge { display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:12px; font-size:11px; font-weight:600; }
    .firebase-on  { background:#dcfce7; color:#16a34a; }
    .firebase-off { background:#fef9c3; color:#a16207; }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- ★★★ Firebase 설정 - 아래 값들을 본인 Firebase 프로젝트 설정으로 교체하세요 ★★★ -->
  <script>
    const FIREBASE_CONFIG = {
      apiKey:            "YOUR_API_KEY",
      authDomain:        "YOUR_PROJECT_ID.firebaseapp.com",
      projectId:         "YOUR_PROJECT_ID",
      storageBucket:     "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId:             "YOUR_APP_ID"
    };

    window.IS_FB = FIREBASE_CONFIG.apiKey !== "YOUR_API_KEY";

    if (window.IS_FB) {
      firebase.initializeApp(FIREBASE_CONFIG);
      window.db = firebase.firestore();
    }
  </script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    /* ─── CONSTANTS ─── */
    const PASS = "1234";

    const INFRA_SUGGESTIONS = [
      "주차장","초등학교","중학교","고등학교","어린이집","유치원",
      "이마트","홈플러스","롯데마트","코스트코","편의점",
      "병원","약국","공원","도서관","문화센터","버스노선","카페","은행","세탁소"
    ];

    /* ─── UTILS ─── */
    const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);

    const driveImgUrl = (url = "") => {
      const m1 = url.match(/\/d\/([A-Za-z0-9_-]+)/);
      if (m1) return `https://lh3.googleusercontent.com/d/${m1[1]}`;
      const m2 = url.match(/[?&]id=([A-Za-z0-9_-]+)/);
      if (m2) return `https://lh3.googleusercontent.com/d/${m2[1]}`;
      return url;
    };

    const formatPrice = (val = "") => {
      const n = parseInt(String(val).replace(/[^0-9]/g,""));
      if (!n) return "";
      const e = Math.floor(n/100000000), m = Math.floor((n%100000000)/10000);
      const parts = [];
      if (e) parts.push(`${e}억`);
      if (m) parts.push(`${m.toLocaleString()}만`);
      return parts.length ? parts.join(" ")+"원" : `${n.toLocaleString()}원`;
    };

    const blankProp = () => ({
      id: uid(),
      buildingName:"", address:"", size:"", price:"",
      nearbyStation:"", constructionYear:"",
      infrastructure:[], mediaLinks:[], memo:"",
      visitDate: new Date().toISOString().slice(0,10),
      createdAt: new Date().toISOString(),
    });

    /* ─── LOCAL STORAGE HELPERS ─── */
    const lsGet  = () => { try { return JSON.parse(localStorage.getItem("jijang_v1")||"[]"); } catch { return []; } };
    const lsSet  = (v) => { try { localStorage.setItem("jijang_v1", JSON.stringify(v)); } catch {} };

    /* ─── PASSWORD GATE ─── */
    function PasswordGate({ onSuccess }) {
      const [pw, setPw]   = useState("");
      const [err, setErr] = useState(false);

      const submit = () => {
        if (pw === PASS) { onSuccess(); }
        else { setErr(true); setTimeout(()=>{ setErr(false); setPw(""); }, 1500); }
      };

      return (
        <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"linear-gradient(145deg,#0c1829 0%,#1a3050 100%)"}}>
          <div className="fade-up" style={{background:"#fff",borderRadius:22,padding:"52px 44px",width:"100%",maxWidth:420,boxShadow:"0 32px 96px rgba(0,0,0,.35)",animation:err?"shake .45s ease":undefined}}>
            <div style={{textAlign:"center",marginBottom:36}}>
              <div style={{fontSize:52,marginBottom:14}}>🏢</div>
              <h1 style={{fontSize:26,fontWeight:900,color:"#0c1829",marginBottom:8}}>임장 히스토리</h1>
              <p style={{fontSize:14,color:"#64748b",lineHeight:1.5}}>부동산 임장 기록 관리 시스템</p>
            </div>
            {window.IS_FB
              ? <div style={{textAlign:"center",marginBottom:16}}><span className="firebase-badge firebase-on">🔥 Firebase 연결됨 · 데이터 공유 활성화</span></div>
              : <div style={{textAlign:"center",marginBottom:16}}><span className="firebase-badge firebase-off">⚠️ Firebase 미설정 · 이 기기에만 저장</span></div>
            }
            <input className="input-field" type="password" placeholder="비밀번호 입력"
              value={pw} onChange={e=>setPw(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit()}
              style={{textAlign:"center",fontSize:18,letterSpacing:6,borderColor:err?"#ef4444":undefined,marginBottom:8}} autoFocus />
            {err
              ? <p style={{color:"#ef4444",fontSize:13,textAlign:"center",marginBottom:16}}>비밀번호가 틀렸습니다</p>
              : <p style={{color:"#94a3b8",fontSize:12,textAlign:"center",marginBottom:16}}>기본 비밀번호: 1234</p>
            }
            <button className="btn-primary" onClick={submit} style={{width:"100%",padding:14,fontSize:16}}>입장하기</button>
          </div>
        </div>
      );
    }

    /* ─── SIDEBAR ─── */
    function Sidebar({ view, setView, count, onAdd }) {
      return (
        <aside style={{width:220,flexShrink:0,background:"#0c1829",display:"flex",flexDirection:"column",padding:"24px 12px",minHeight:"100vh"}}>
          <div style={{padding:"0 8px",marginBottom:28}}>
            <div style={{fontSize:22,marginBottom:6}}>🏠</div>
            <h2 style={{color:"#fff",fontWeight:800,fontSize:15,lineHeight:1.3}}>임장 히스토리</h2>
            <p style={{color:"#334155",fontSize:11,marginTop:3}}>부동산 탐방 기록</p>
          </div>
          <button className="btn-primary" onClick={onAdd} style={{width:"100%",marginBottom:20,display:"flex",alignItems:"center",gap:6,justifyContent:"center",fontSize:14}}>
            <span style={{fontSize:18,lineHeight:1}}>+</span> 임장 추가
          </button>
          <nav style={{display:"flex",flexDirection:"column",gap:4}}>
            {[{id:"list",icon:"☰",label:"전체 목록",badge:count},{id:"map",icon:"🗺",label:"지도 보기"}].map(l=>(
              <button key={l.id} className={`sidebar-link${view===l.id?" active":""}`} onClick={()=>setView(l.id)}>
                <span>{l.icon}</span>
                <span style={{flex:1}}>{l.label}</span>
                {l.badge!==undefined && <span style={{background:"rgba(255,255,255,.1)",color:"#94a3b8",fontSize:11,padding:"2px 8px",borderRadius:12,fontWeight:700}}>{l.badge}</span>}
              </button>
            ))}
          </nav>
          <div style={{marginTop:"auto",padding:"0 8px"}}>
            <div style={{borderTop:"1px solid #1e2d3d",paddingTop:16}}>
              {window.IS_FB
                ? <p style={{color:"#16a34a",fontSize:11,fontWeight:600}}>🔥 Firebase 연결됨<br/><span style={{color:"#334155",fontWeight:400}}>데이터 실시간 공유 중</span></p>
                : <p style={{color:"#a16207",fontSize:11,fontWeight:600}}>⚠️ Firebase 미설정<br/><span style={{color:"#334155",fontWeight:400}}>index.html에 설정 필요</span></p>
              }
            </div>
          </div>
        </aside>
      );
    }

    /* ─── PROPERTY CARD ─── */
    function PropertyCard({ prop, onSelect, onEdit, onDelete }) {
      const [menu, setMenu] = useState(false);
      return (
        <div className="card prop-card fade-up" onClick={()=>onSelect(prop)} style={{padding:22,position:"relative"}}>
          <div onClick={e=>{e.stopPropagation();setMenu(!menu);}} style={{position:"absolute",top:14,right:14}}>
            <button className="btn-icon" style={{fontSize:20,color:"#cbd5e1"}}>⋯</button>
            {menu && (<>
              <div style={{position:"fixed",inset:0,zIndex:5}} onClick={e=>{e.stopPropagation();setMenu(false);}} />
              <div style={{position:"absolute",top:"100%",right:0,zIndex:10,background:"#fff",borderRadius:10,padding:6,boxShadow:"0 8px 28px rgba(0,0,0,.14)",width:120}}>
                <button className="btn-icon" onClick={e=>{e.stopPropagation();setMenu(false);onEdit(prop);}} style={{width:"100%",justifyContent:"flex-start",padding:"8px 12px",fontSize:13,color:"#1e293b",gap:8}}>✏️ 수정</button>
                <button className="btn-icon" onClick={e=>{e.stopPropagation();setMenu(false);onDelete(prop.id);}} style={{width:"100%",justifyContent:"flex-start",padding:"8px 12px",fontSize:13,color:"#dc2626",gap:8}}>🗑 삭제</button>
              </div>
            </>)}
          </div>
          <h3 style={{fontWeight:700,fontSize:16,color:"#0f172a",marginBottom:5,paddingRight:36,lineHeight:1.35}}>
            {prop.buildingName || <span style={{color:"#94a3b8"}}>이름 없음</span>}
          </h3>
          <p style={{fontSize:13,color:"#64748b",marginBottom:14}}>{prop.address||"주소 없음"}</p>
          <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:14}}>
            {prop.size             && <span className="tag tag-blue">{prop.size}평</span>}
            {prop.price            && <span className="tag tag-green">💰 {formatPrice(prop.price)}</span>}
            {prop.nearbyStation    && <span className="tag tag-gray">🚇 {prop.nearbyStation}</span>}
            {prop.constructionYear && <span className="tag tag-orange">{prop.constructionYear}년</span>}
          </div>
          {prop.infrastructure.length>0 && (
            <div style={{display:"flex",gap:4,flexWrap:"wrap",marginBottom:12}}>
              {prop.infrastructure.slice(0,5).map(i=>(
                <span key={i.id} style={{fontSize:11,color:"#64748b",background:"#f8fafc",padding:"2px 7px",borderRadius:5,border:"1px solid #f1f5f9"}}>{i.label}</span>
              ))}
              {prop.infrastructure.length>5 && <span style={{fontSize:11,color:"#94a3b8"}}>+{prop.infrastructure.length-5}</span>}
            </div>
          )}
          <div style={{borderTop:"1px solid #f8fafc",paddingTop:10,display:"flex",justifyContent:"space-between"}}>
            <span style={{fontSize:11,color:"#94a3b8"}}>📅 {prop.visitDate}</span>
            {prop.mediaLinks.length>0 && <span style={{fontSize:11,color:"#94a3b8"}}>📸 {prop.mediaLinks.filter(m=>m.type==="photo").length} · 🎬 {prop.mediaLinks.filter(m=>m.type==="video").length}</span>}
          </div>
        </div>
      );
    }

    /* ─── LIST VIEW ─── */
    function ListView({ properties, onSelect, onEdit, onDelete, onAdd }) {
      const [q, setQ]       = useState("");
      const [sort, setSort] = useState("newest");

      const list = properties
        .filter(p=>!q||p.buildingName.includes(q)||p.address.includes(q))
        .sort((a,b)=>{
          if(sort==="newest") return new Date(b.createdAt)-new Date(a.createdAt);
          if(sort==="price")  return (parseInt(a.price)||0)-(parseInt(b.price)||0);
          if(sort==="size")   return (parseFloat(a.size)||0)-(parseFloat(b.size)||0);
          return 0;
        });

      return (
        <div style={{padding:"36px 32px",maxWidth:1120,margin:"0 auto"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-end",marginBottom:28,flexWrap:"wrap",gap:12}}>
            <div>
              <h1 style={{fontSize:26,fontWeight:800,color:"#0f172a"}}>임장 목록</h1>
              <p style={{fontSize:14,color:"#64748b",marginTop:5}}>총 <strong style={{color:"#1d4ed8"}}>{properties.length}</strong>곳 방문 기록</p>
            </div>
            <div style={{display:"flex",gap:8}}>
              <input className="input-field" placeholder="🔍 아파트명·주소 검색" value={q} onChange={e=>setQ(e.target.value)} style={{width:220}} />
              <select className="input-field" value={sort} onChange={e=>setSort(e.target.value)} style={{width:110}}>
                <option value="newest">최신순</option>
                <option value="price">가격순</option>
                <option value="size">평수순</option>
              </select>
            </div>
          </div>
          {properties.length===0 ? (
            <div className="card" style={{padding:"72px 40px",textAlign:"center"}}>
              <div style={{fontSize:52,marginBottom:18}}>🏢</div>
              <h3 style={{fontSize:20,fontWeight:700,color:"#374151",marginBottom:10}}>아직 임장 기록이 없어요</h3>
              <p style={{color:"#9ca3af",fontSize:14,marginBottom:24}}>첫 번째 임장 기록을 추가해보세요!</p>
              <button className="btn-primary" onClick={onAdd}>+ 첫 임장 추가</button>
            </div>
          ) : (
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(320px,1fr))",gap:16}}>
              {list.map(p=><PropertyCard key={p.id} prop={p} onSelect={onSelect} onEdit={onEdit} onDelete={onDelete} />)}
            </div>
          )}
        </div>
      );
    }

    /* ─── MAP VIEW ─── */
    function MapView({ properties }) {
      return (
        <div style={{padding:"36px 32px"}}>
          <div style={{marginBottom:24}}>
            <h1 style={{fontSize:26,fontWeight:800,color:"#0f172a"}}>지도 보기</h1>
            <p style={{fontSize:14,color:"#64748b",marginTop:5}}>Step 2에서 네이버지도 API 연동 예정</p>
          </div>
          <div className="card" style={{height:480,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",background:"linear-gradient(135deg,#f0f4f9 0%,#e2eaf5 100%)",border:"2px dashed #c7d2e0"}}>
            <div style={{fontSize:56,marginBottom:18}}>🗺️</div>
            <h3 style={{fontSize:20,fontWeight:700,color:"#374151",marginBottom:10}}>네이버지도 연동 준비 중</h3>
            <p style={{fontSize:14,color:"#64748b",textAlign:"center",maxWidth:320,lineHeight:1.7}}>
              네이버 Maps API 키 발급 후<br/>방문한 아파트가 지도 위에 마커로 표시됩니다
            </p>
            <div style={{marginTop:24,padding:"10px 20px",background:"#fff",borderRadius:10,fontSize:13,color:"#475569",boxShadow:"0 2px 8px rgba(0,0,0,.08)"}}>
              📍 등록된 임장지 <strong style={{color:"#1d4ed8"}}>{properties.length}</strong>곳
            </div>
          </div>
          {properties.length>0 && (
            <div className="card" style={{marginTop:20,padding:24}}>
              <p className="section-label">등록 임장 목록</p>
              {properties.map((p,i)=>(
                <div key={p.id} style={{display:"flex",alignItems:"center",gap:14,padding:"10px 0",borderBottom:"1px solid #f8fafc"}}>
                  <div style={{width:26,height:26,background:"#dbeafe",borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,fontWeight:700,color:"#1d4ed8",flexShrink:0}}>{i+1}</div>
                  <div style={{flex:1}}><p style={{fontSize:14,fontWeight:600}}>{p.buildingName||"이름 없음"}</p><p style={{fontSize:12,color:"#64748b"}}>{p.address}</p></div>
                  {p.price && <span className="tag tag-green">{formatPrice(p.price)}</span>}
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    /* ─── DETAIL VIEW ─── */
    function DetailView({ prop, onEdit, onDelete, onBack }) {
      const [confirmDel, setConfirmDel] = useState(false);
      const [lightbox,   setLightbox]   = useState(null);

      return (
        <div style={{padding:"36px 32px",maxWidth:820,margin:"0 auto"}} className="fade-up">
          <button className="btn-secondary" onClick={onBack} style={{marginBottom:22,fontSize:13}}>← 목록으로</button>
          <div className="card" style={{padding:30,marginBottom:16}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:16}}>
              <div style={{flex:1}}>
                <h1 style={{fontSize:26,fontWeight:800,color:"#0f172a",marginBottom:7,lineHeight:1.3}}>{prop.buildingName||"이름 없음"}</h1>
                <p style={{color:"#64748b",fontSize:14,marginBottom:20}}>📍 {prop.address||"주소 없음"}</p>
                <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(140px,1fr))",gap:16}}>
                  {prop.size && (<div><span style={{fontSize:11,color:"#94a3b8",fontWeight:600,textTransform:"uppercase",letterSpacing:".06em",display:"block",marginBottom:4}}>전용면적</span><span className="tag tag-blue" style={{fontSize:14,padding:"4px 12px"}}>{prop.size}평</span></div>)}
                  {prop.price && (<div><span style={{fontSize:11,color:"#94a3b8",fontWeight:600,textTransform:"uppercase",letterSpacing:".06em",display:"block",marginBottom:4}}>매매가격</span><span className="tag tag-green" style={{fontSize:14,padding:"4px 12px"}}>{formatPrice(prop.price)}</span></div>)}
                  {prop.nearbyStation && (<div><span style={{fontSize:11,color:"#94a3b8",fontWeight:600,display:"block",marginBottom:4}}>인근역</span><span style={{fontSize:15,fontWeight:500}}>{prop.nearbyStation}</span></div>)}
                  {prop.constructionYear && (<div><span style={{fontSize:11,color:"#94a3b8",fontWeight:600,display:"block",marginBottom:4}}>준공년도</span><span style={{fontSize:15,fontWeight:500}}>{prop.constructionYear}년</span></div>)}
                </div>
              </div>
              <div style={{display:"flex",gap:8,flexShrink:0}}>
                <button className="btn-secondary" onClick={onEdit}>✏️ 수정</button>
                <button className="btn-danger" onClick={()=>setConfirmDel(true)}>🗑 삭제</button>
              </div>
            </div>
            <div style={{marginTop:20,paddingTop:16,borderTop:"1px solid #f1f5f9"}}>
              <span style={{fontSize:12,color:"#94a3b8"}}>📅 임장일: {prop.visitDate}</span>
            </div>
          </div>

          {prop.infrastructure.length>0 && (
            <div className="card" style={{padding:24,marginBottom:16}}>
              <p className="section-label">주변 및 인프라</p>
              <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(170px,1fr))",gap:10}}>
                {prop.infrastructure.map(item=>(
                  <div key={item.id} style={{padding:"10px 14px",background:"#f8fafc",borderRadius:8,border:"1px solid #e8edf5"}}>
                    <p style={{fontWeight:600,fontSize:13,color:"#334155"}}>{item.label}</p>
                    {item.note && <p style={{fontSize:12,color:"#64748b",marginTop:3}}>{item.note}</p>}
                  </div>
                ))}
              </div>
            </div>
          )}

          {prop.mediaLinks.length>0 && (
            <div className="card" style={{padding:24,marginBottom:16}}>
              <p className="section-label">사진 / 영상</p>
              <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(150px,1fr))",gap:10}}>
                {prop.mediaLinks.map(media=>(
                  <div key={media.id} onClick={()=>setLightbox(media)}
                    style={{cursor:"pointer",borderRadius:10,overflow:"hidden",border:"1px solid #e2e8f0",aspectRatio:"4/3",background:"#f8fafc",position:"relative"}}>
                    {media.type==="photo" ? (<>
                      <img src={driveImgUrl(media.url)} alt={media.desc} style={{width:"100%",height:"100%",objectFit:"cover"}}
                        onError={e=>{e.target.style.display="none";e.target.nextSibling.style.display="flex";}} />
                      <div style={{display:"none",position:"absolute",inset:0,flexDirection:"column",alignItems:"center",justifyContent:"center",gap:4}}>
                        <span style={{fontSize:28}}>📸</span><span style={{fontSize:11,color:"#64748b"}}>{media.desc||"사진"}</span>
                      </div>
                    </>) : (
                      <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",height:"100%",gap:6}}>
                        <span style={{fontSize:30}}>🎬</span>
                        <span style={{fontSize:11,color:"#64748b",textAlign:"center",padding:"0 8px"}}>{media.desc||"영상"}</span>
                      </div>
                    )}
                  </div>
                ))}
              </div>
            </div>
          )}

          {prop.memo && (
            <div className="card" style={{padding:24,marginBottom:16}}>
              <p className="section-label">메모</p>
              <p style={{fontSize:14,color:"#374151",lineHeight:1.85,whiteSpace:"pre-wrap"}}>{prop.memo}</p>
            </div>
          )}

          <div className="card" style={{padding:24,background:"#f8fafc",border:"2px dashed #dde4f0"}}>
            <p className="section-label">실거래가 히스토리 (Step 3)</p>
            <div style={{textAlign:"center",padding:"24px 0"}}>
              <div style={{fontSize:32,marginBottom:10}}>📊</div>
              <p style={{fontSize:13,color:"#94a3b8",lineHeight:1.7}}>국토부 실거래가 API 연동 후<br/>이 아파트의 <strong>최근 3년 매매 데이터</strong>가 그래프로 표시됩니다</p>
            </div>
          </div>

          {lightbox && (
            <div className="modal-overlay" onClick={()=>setLightbox(null)}>
              <div onClick={e=>e.stopPropagation()} style={{maxWidth:"92vw",maxHeight:"92vh",borderRadius:14,overflow:"hidden",background:"#111"}}>
                {lightbox.type==="photo"
                  ? <img src={driveImgUrl(lightbox.url)} alt="" style={{maxWidth:"90vw",maxHeight:"80vh",objectFit:"contain",display:"block"}} />
                  : <div style={{padding:"40px 60px",textAlign:"center"}}><p style={{color:"#fff",fontSize:16,fontWeight:600,marginBottom:12}}>🎬 {lightbox.desc}</p><a href={lightbox.url} target="_blank" rel="noreferrer" style={{color:"#60a5fa",fontSize:14}}>드라이브에서 열기 →</a></div>
                }
                {lightbox.desc && lightbox.type==="photo" && <p style={{padding:"10px 16px",fontSize:13,color:"#9ca3af",background:"#000"}}>{lightbox.desc}</p>}
              </div>
            </div>
          )}

          {confirmDel && (
            <div className="modal-overlay">
              <div className="modal-box">
                <h3 style={{fontWeight:700,fontSize:18,marginBottom:12}}>정말 삭제할까요?</h3>
                <p style={{fontSize:14,color:"#64748b",marginBottom:28}}><strong>{prop.buildingName}</strong>의 임장 기록이 영구 삭제됩니다.</p>
                <div style={{display:"flex",gap:10}}>
                  <button className="btn-secondary" onClick={()=>setConfirmDel(false)} style={{flex:1}}>취소</button>
                  <button className="btn-danger" onClick={()=>{onDelete();onBack();}} style={{flex:1}}>삭제</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    /* ─── INFRA EDITOR ─── */
    function InfraEditor({ items, onChange }) {
      const [label, setLabel] = useState("");
      const [note,  setNote]  = useState("");
      const [open,  setOpen]  = useState(false);

      const add = (l=label) => {
        if (!l.trim()) return;
        onChange([...items, {id:uid(),label:l.trim(),note:l===label?note.trim():""}]);
        setLabel(""); setNote(""); setOpen(false);
      };
      const remove     = (id) => onChange(items.filter(i=>i.id!==id));
      const updateNote = (id,v) => onChange(items.map(i=>i.id===id?{...i,note:v}:i));
      const suggestions = INFRA_SUGGESTIONS.filter(s=>!items.find(i=>i.label===s)&&(!label||s.includes(label)));

      return (
        <div>
          {items.length>0 && (
            <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:12}}>
              {items.map(item=>(
                <div key={item.id} style={{display:"flex",gap:8,alignItems:"center",background:"#f8fafc",padding:"8px 12px",borderRadius:8,border:"1px solid #e8edf5"}}>
                  <span style={{fontWeight:600,fontSize:13,minWidth:80,color:"#334155"}}>{item.label}</span>
                  <input className="input-field" placeholder="메모 (선택)" value={item.note} onChange={e=>updateNote(item.id,e.target.value)} style={{flex:1,padding:"6px 10px",fontSize:13}} />
                  <button className="btn-icon" onClick={()=>remove(item.id)} style={{color:"#ef4444"}}>✕</button>
                </div>
              ))}
            </div>
          )}
          <div style={{position:"relative"}}>
            <div style={{display:"flex",gap:8}}>
              <input className="input-field" placeholder="항목 입력 (예: 마트, 공원...)" value={label}
                onChange={e=>{setLabel(e.target.value);setOpen(true);}} onFocus={()=>setOpen(true)}
                onKeyDown={e=>e.key==="Enter"&&add()} style={{flex:2}} />
              <input className="input-field" placeholder="메모 (선택)" value={note} onChange={e=>setNote(e.target.value)} onKeyDown={e=>e.key==="Enter"&&add()} style={{flex:2}} />
              <button className="btn-primary" onClick={()=>add()}>추가</button>
            </div>
            {open && suggestions.length>0 && (<>
              <div style={{position:"fixed",inset:0,zIndex:5}} onClick={()=>setOpen(false)} />
              <div style={{position:"absolute",top:"calc(100% + 6px)",left:0,right:0,background:"#fff",borderRadius:10,border:"1px solid #e2e8f0",boxShadow:"0 8px 28px rgba(0,0,0,.10)",zIndex:10,padding:12}}>
                <p style={{fontSize:11,color:"#94a3b8",marginBottom:8,fontWeight:600}}>추천 항목</p>
                <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
                  {suggestions.slice(0,14).map(s=>(
                    <button key={s} onClick={()=>{add(s);setOpen(false);}}
                      style={{padding:"4px 11px",border:"1px solid #e2e8f0",borderRadius:20,background:"#f8fafc",fontSize:12,cursor:"pointer",color:"#374151"}}>{s}</button>
                  ))}
                </div>
              </div>
            </>)}
          </div>
        </div>
      );
    }

    /* ─── MEDIA EDITOR ─── */
    function MediaEditor({ items, onChange }) {
      const [url,  setUrl]  = useState("");
      const [type, setType] = useState("photo");
      const [desc, setDesc] = useState("");

      const add = () => {
        if (!url.trim()) return;
        onChange([...items, {id:uid(),type,url:url.trim(),desc:desc.trim()}]);
        setUrl(""); setDesc("");
      };
      const remove = (id) => onChange(items.filter(i=>i.id!==id));

      return (
        <div>
          {items.length>0 && (
            <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:14}}>
              {items.map(item=>(
                <div key={item.id} style={{display:"flex",gap:10,alignItems:"center",background:"#f8fafc",padding:"10px 14px",borderRadius:8,border:"1px solid #e8edf5"}}>
                  <span style={{fontSize:20}}>{item.type==="photo"?"📸":"🎬"}</span>
                  <div style={{flex:1,minWidth:0}}>
                    <p style={{fontSize:13,fontWeight:600}}>{item.desc||"(설명 없음)"}</p>
                    <p style={{fontSize:11,color:"#64748b",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{item.url}</p>
                  </div>
                  <button className="btn-icon" onClick={()=>remove(item.id)} style={{color:"#ef4444"}}>✕</button>
                </div>
              ))}
            </div>
          )}
          <div style={{background:"#f8fafc",border:"1px solid #e2e8f0",borderRadius:10,padding:14}}>
            <p style={{fontSize:12,color:"#64748b",marginBottom:10}}>📌 구글 드라이브 → 파일 우클릭 → 공유 링크 복사 후 붙여넣기</p>
            <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
              <select className="input-field" value={type} onChange={e=>setType(e.target.value)} style={{width:110,flexShrink:0}}>
                <option value="photo">📸 사진</option>
                <option value="video">🎬 영상</option>
              </select>
              <input className="input-field" placeholder="구글 드라이브 공유 링크" value={url} onChange={e=>setUrl(e.target.value)} style={{flex:"2 1 200px"}} />
              <input className="input-field" placeholder="설명 (선택)" value={desc} onChange={e=>setDesc(e.target.value)} style={{flex:"1 1 120px"}} />
              <button className="btn-primary" onClick={add} style={{flexShrink:0}}>추가</button>
            </div>
          </div>
        </div>
      );
    }

    /* ─── PROPERTY FORM ─── */
    const LBL = ({children}) => <label style={{display:"block",fontSize:13,fontWeight:600,color:"#374151",marginBottom:6}}>{children}</label>;

    function PropertyForm({ initial, onSave, onCancel }) {
      const [form, setForm] = useState(initial ? {...initial} : blankProp());
      const set = (k,v) => setForm(f=>({...f,[k]:v}));

      const handleSave = () => {
        if (!form.buildingName.trim()&&!form.address.trim()) { alert("아파트명 또는 주소를 입력해주세요"); return; }
        onSave(form);
      };

      return (
        <div style={{padding:"36px 32px",maxWidth:780,margin:"0 auto"}} className="fade-up">
          <div style={{marginBottom:30}}>
            <h1 style={{fontSize:26,fontWeight:800,color:"#0f172a"}}>{initial?"임장 기록 수정":"새 임장 기록"}</h1>
            <p style={{fontSize:14,color:"#64748b",marginTop:5}}>방문한 아파트 정보를 입력해주세요</p>
          </div>

          <div className="card" style={{padding:26,marginBottom:16}}>
            <p className="section-label">기본 정보</p>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16}}>
              <div><LBL>아파트명 *</LBL><input className="input-field" placeholder="예: 래미안 퍼스티지" value={form.buildingName} onChange={e=>set("buildingName",e.target.value)} /></div>
              <div><LBL>임장일</LBL><input className="input-field" type="date" value={form.visitDate} onChange={e=>set("visitDate",e.target.value)} /></div>
              <div style={{gridColumn:"1/-1"}}><LBL>주소</LBL><input className="input-field" placeholder="예: 서울시 강남구 대치동 123-4" value={form.address} onChange={e=>set("address",e.target.value)} /></div>
              <div><LBL>평수 (전용면적)</LBL><input className="input-field" placeholder="예: 34" value={form.size} onChange={e=>set("size",e.target.value)} /></div>
              <div><LBL>준공년도</LBL><input className="input-field" placeholder="예: 2010" value={form.constructionYear} onChange={e=>set("constructionYear",e.target.value)} /></div>
              <div>
                <LBL>가격 (만원 단위)</LBL>
                <input className="input-field" placeholder="예: 120000 → 12억원" value={form.price} onChange={e=>set("price",e.target.value.replace(/[^0-9]/g,""))} />
                {form.price && <p style={{fontSize:12,color:"#1d4ed8",marginTop:5,fontWeight:600}}>= {formatPrice(form.price)}</p>}
              </div>
              <div><LBL>인근역</LBL><input className="input-field" placeholder="예: 강남역 도보 10분" value={form.nearbyStation} onChange={e=>set("nearbyStation",e.target.value)} /></div>
            </div>
          </div>

          <div className="card" style={{padding:26,marginBottom:16}}>
            <p className="section-label">주변 및 인프라</p>
            <InfraEditor items={form.infrastructure} onChange={v=>set("infrastructure",v)} />
          </div>

          <div className="card" style={{padding:26,marginBottom:16}}>
            <p className="section-label">사진 / 영상 (구글 드라이브 링크)</p>
            <MediaEditor items={form.mediaLinks} onChange={v=>set("mediaLinks",v)} />
          </div>

          <div className="card" style={{padding:26,marginBottom:28}}>
            <p className="section-label">메모 / 기타</p>
            <textarea className="textarea-field" placeholder="추가적인 인상, 단점, 특이사항 등을 자유롭게 적어주세요"
              value={form.memo} onChange={e=>set("memo",e.target.value)} style={{minHeight:130}} />
          </div>

          <div style={{display:"flex",gap:12,justifyContent:"flex-end"}}>
            <button className="btn-secondary" onClick={onCancel}>취소</button>
            <button className="btn-primary" onClick={handleSave} style={{padding:"10px 36px"}}>{initial?"수정 완료":"저장하기"}</button>
          </div>
        </div>
      );
    }

    /* ─── MAIN APP ─── */
    function App() {
      const [auth,       setAuth]       = useState(false);
      const [properties, setProperties] = useState([]);
      const [view,       setView]       = useState("list");
      const [selected,   setSelected]   = useState(null);
      const [editing,    setEditing]    = useState(null);

      /* Data loading */
      useEffect(() => {
        if (!auth) return;

        if (!window.IS_FB) {
          setProperties(lsGet());
          return;
        }

        const unsub = window.db.collection("properties")
          .orderBy("createdAt", "desc")
          .onSnapshot(snap => {
            setProperties(snap.docs.map(d => ({ ...d.data(), id: d.id })));
          }, err => console.error("Firestore error:", err));

        return () => unsub();
      }, [auth]);

      /* CRUD */
      const saveProp = async (prop) => {
        if (!window.IS_FB) {
          const next = editing
            ? properties.map(p => p.id===prop.id ? prop : p)
            : [prop, ...properties];
          setProperties(next);
          lsSet(next);
        } else {
          await window.db.collection("properties").doc(prop.id).set(prop);
        }
        if (editing) { setSelected(prop); setView("detail"); }
        else { setView("list"); }
        setEditing(null);
      };

      const deleteProp = async (id) => {
        if (!window.IS_FB) {
          const next = properties.filter(p => p.id!==id);
          setProperties(next);
          lsSet(next);
        } else {
          await window.db.collection("properties").doc(id).delete();
        }
        setSelected(null);
        setView("list");
      };

      const go = (v) => { setView(v); setSelected(null); setEditing(null); };

      if (!auth) return <PasswordGate onSuccess={()=>setAuth(true)} />;

      return (
        <div style={{display:"flex",minHeight:"100vh"}}>
          <Sidebar view={view} setView={go} count={properties.length} onAdd={()=>{setEditing(null);setView("form");}} />
          <main style={{flex:1,overflow:"auto",background:"#f0f4f9"}}>
            {view==="list" && <ListView properties={properties} onSelect={p=>{setSelected(p);setView("detail");}} onEdit={p=>{setEditing(p);setView("form");}} onDelete={id=>deleteProp(id)} onAdd={()=>{setEditing(null);setView("form");}} />}
            {view==="map"  && <MapView properties={properties} />}
            {view==="detail" && selected && <DetailView prop={selected} onEdit={()=>{setEditing(selected);setView("form");}} onDelete={()=>deleteProp(selected.id)} onBack={()=>go("list")} />}
            {view==="form" && <PropertyForm initial={editing} onSave={saveProp} onCancel={()=>{setEditing(null);setView(editing?"detail":"list");}} />}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
