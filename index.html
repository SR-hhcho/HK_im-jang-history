    };

    const getDongCode = (address = "") => {
      // 구 단위로 먼저 (더 정확)
      for (const [key, code] of Object.entries(DONG_CODES)) {

      for (const [key, code] of Object.entries(DONG_CODES)) {
        if (address.includes(key)) return code;

      return "";
    };


    const GEMINI_KEY = "AIzaSyBGmYvkWL_oi9XbrC5PhAfD37EFjx6da48";

    const DEFAULT_WEIGHTS = {
      "역세권":   20,

      const m1 = url.match(/\/d\/([A-Za-z0-9_-]+)/);
      if (m1) return `https://lh3.googleusercontent.com/d/${m1[1]}`;
      const m2 = url.match(/[?&]id=([A-Za-z0-9_-]+)/);
      if (m2) return `https://lh3.googleusercontent.com/d/${m2[1]}`;
      return url;
    };

    // 입력값은 만원 단위 (예: 120000 → 12억원)
    const formatPrice = (val = "") => {
      const n = parseInt(String(val).replace(/[^0-9]/g,""));
      if (!n) return "";
      const eok = Math.floor(n / 10000);
      const man = n % 10000;
      const parts = [];
      if (eok) parts.push(`${eok}억`);
      if (man) parts.push(`${man.toLocaleString()}만`);
      return parts.length ? parts.join(" ") + "원" : `${n.toLocaleString()}만원`;

    /* ─── PASSWORD GATE ─── */
    function PasswordGate({ onSuccess }) {
      const [pw, setPw]   = useState("");
      const [err, setErr] = useState(false);

      const submit = () => {
        if (pw === PASS) { onSuccess(); }
        else { setErr(true); setTimeout(()=>{ setErr(false); setPw(""); }, 1500); }
      };

      return (
        <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"linear-gradient(145deg,#0c1829 0%,#1a3050 100%)"}}>

              : <div style={{textAlign:"center",marginBottom:16}}><span className="firebase-badge firebase-off">⚠️ Firebase 미설정 · 이 기기에만 저장</span></div>
            }

            {err
              ? <p style={{color:"#ef4444",fontSize:13,textAlign:"center",marginBottom:16}}>비밀번호가 틀렸습니다</p>
              : <p style={{color:"#94a3b8",fontSize:12,textAlign:"center",marginBottom:16}}>기본 비밀번호: 1234</p>

            <button className="btn-primary" onClick={submit} style={{width:"100%",padding:14,fontSize:16}}>입장하기</button>

      );

    /* ─── LIST VIEW ─── */
    function ListView({ properties, onSelect, onEdit, onDelete, onAdd }) {
      const [q,    setQ]    = useState("");
      const [sort, setSort] = useState("newest");
      const [typeFilter, setTypeFilter] = useState("전체");

      const list = properties
        .filter(p => typeFilter==="전체" || (p.propertyType||"임장")===typeFilter)

        .sort((a,b)=>{
          if(sort==="newest") return new Date(b.createdAt)-new Date(a.createdAt);
          if(sort==="price")  return (parseInt(a.price)||0)-(parseInt(b.price)||0);
          if(sort==="size")   return (parseFloat(a.size)||0)-(parseFloat(b.size)||0);
          return 0;
        });

      return (
        <div style={{padding:"36px 32px",maxWidth:1120,margin:"0 auto"}} className="page-pad">

              <select className="input-field" value={sort} onChange={e=>setSort(e.target.value)} style={{width:110}}>
                <option value="newest">최신순</option>
                <option value="price">가격순</option>
                <option value="size">평수순</option>
              </select>

        if (!kakaoReady) return;

    /* ─── DETAIL VIEW ─── */
    /* ─── STARS ─── */
    function Stars({ rating, size=16, color="#f59e0b" }) {
      if (!rating && rating !== 0) return null;
      const r = Number(rating);
      const filled = Math.round(r / 2); // 0~10 → 0~5 별
      const empty  = 5 - filled;
      return (
        <span style={{color, fontSize:size, lineHeight:1, letterSpacing:1}}>
          {"★".repeat(filled)}{"☆".repeat(empty)}
          <span style={{fontSize:size*0.8, marginLeft:5, fontWeight:800, color}}>{r.toFixed(1)}<span style={{fontSize:size*0.65,opacity:.7}}>/10</span></span>
        </span>
      );
    }

    function StarInput({ value, onChange }) {
      // 0~10점, 별 5개 (별 1개 = 2점)
      const [hover, setHover] = useState(null);
      const toScore = (n, isLeft) => isLeft ? (n*2-1) : n*2; // 별n 왼쪽=홀수, 오른쪽=짝수
      const handleMove = (e, n) => {
        const rect = e.currentTarget.getBoundingClientRect();
        const x = (e.touches?e.touches[0].clientX:e.clientX) - rect.left;
        setHover(toScore(n, x < rect.width/2));
      };
      const handleClick = (e, n) => {
        const rect = e.currentTarget.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const v = toScore(n, x < rect.width/2);
        onChange(value===v ? null : v);
      };
      const disp = hover ?? value ?? 0;
      const dispStar = disp / 2; // 0~10 → 0~5
      return (
        <div style={{display:"flex",gap:2,alignItems:"center"}}>
          {[1,2,3,4,5].map(n=>(
            <span key={n}
              onMouseMove={e=>handleMove(e,n)} onMouseLeave={()=>setHover(null)}
              onClick={e=>handleClick(e,n)}
              style={{fontSize:30,cursor:"pointer",lineHeight:1,
                color: dispStar>=n?"#f59e0b": dispStar>=n-0.5?"#f59e0b":"#e2e8f0"}}>★</span>
          ))}
          {value!=null && <span style={{fontSize:13,color:"#f59e0b",marginLeft:8,fontWeight:800}}>{value}<span style={{fontSize:10,color:"#94a3b8"}}>/10</span></span>}
          {value!=null && <button onClick={()=>onChange(null)} style={{fontSize:11,color:"#94a3b8",background:"transparent",border:"none",cursor:"pointer"}}>초기화</button>}
        </div>
      );
    }

    function DetailView({ prop, onEdit, onDelete, onBack }) {
      const [confirmDel,  setConfirmDel]  = useState(false);
      const [lightbox,    setLightbox]    = useState(null);
      const [tab,         setTab]         = useState("인프라");

    function VirtualJoystick({ onMove }) {
      const baseRef = React.useRef(null);
      const [thumb, setThumb] = useState({x:0,y:0});
      const active = React.useRef(false);
      const MAX = 38;
      const getDir = (cx,cy) => {
        const base = baseRef.current.getBoundingClientRect();
        const bx = base.left+base.width/2, by = base.top+base.height/2;
        const dx = cx-bx, dy = cy-by;
        const dist = Math.sqrt(dx*dx+dy*dy);
        const clamp = Math.min(dist,MAX);
        const angle = Math.atan2(dy,dx);
        const tx = Math.cos(angle)*clamp, ty = Math.sin(angle)*clamp;
        setThumb({x:tx,y:ty});
        onMove({dx: tx/MAX, dy: ty/MAX});
      };
      return (
        <div ref={baseRef}
          style={{width:90,height:90,borderRadius:"50%",background:"rgba(255,255,255,.15)",border:"2px solid rgba(255,255,255,.3)",
            position:"relative",display:"flex",alignItems:"center",justifyContent:"center",touchAction:"none",userSelect:"none"}}
          onTouchStart={e=>{active.current=true;getDir(e.touches[0].clientX,e.touches[0].clientY);}}
          onTouchMove={e=>{if(active.current)getDir(e.touches[0].clientX,e.touches[0].clientY);}}
          onTouchEnd={()=>{active.current=false;setThumb({x:0,y:0});onMove({dx:0,dy:0});}}>
          <div style={{width:34,height:34,borderRadius:"50%",background:"rgba(255,255,255,.5)",
            position:"absolute",transform:`translate(${thumb.x}px,${thumb.y}px)`,transition:"none"}} />
        </div>
      );
    }

    function BulletGame({ myIp, board, saveScore }) {
      const cvs  = React.useRef(null);
      const loop = React.useRef(null);
      const gs   = React.useRef({});
      const joy  = React.useRef({dx:0,dy:0});
      const [phase, setPhase] = useState("ready");
      const [score, setScore] = useState(0);

      const start = () => {
        const cv=cvs.current; if(!cv) return;
        const W=cv.width,H=cv.height;
        gs.current={px:W/2,py:H/2,bullets:[],alive:true,score:0,lastSpawn:0,interval:1100,t0:performance.now()};
        setPhase("playing"); setScore(0);
        cancelAnimationFrame(loop.current);
        const tick=(now)=>{
          const g=gs.current; if(!g.alive) return;
          // Joystick
          g.px=Math.max(10,Math.min(W-10,g.px+joy.current.dx*3.5));
          g.py=Math.max(10,Math.min(H-10,g.py+joy.current.dy*3.5));
          // Spawn
          if(now-g.lastSpawn>g.interval){
            g.lastSpawn=now; g.interval=Math.max(380,1100-g.score*4);
            const edge=Math.floor(Math.random()*4);
            let bx,by;
            if(edge===0){bx=Math.random()*W;by=-10;}
            else if(edge===1){bx=W+10;by=Math.random()*H;}
            else if(edge===2){bx=Math.random()*W;by=H+10;}
            else{bx=-10;by=Math.random()*H;}
            const ang=Math.atan2(g.py-by,g.px-bx);
            const spd=1.8+g.score*0.04;
            g.bullets.push({x:bx,y:by,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,r:7,
              c:`hsl(${Math.random()*360},80%,60%)`});
          }
          g.bullets.forEach(b=>{b.x+=b.vx;b.y+=b.vy;});
          g.bullets=g.bullets.filter(b=>b.x>-30&&b.x<W+30&&b.y>-30&&b.y<H+30);
          // Collision
          for(const b of g.bullets){
            const dx=g.px-b.x,dy=g.py-b.y;
            if(Math.sqrt(dx*dx+dy*dy)<b.r+7){g.alive=false;break;}
          }
          g.score=Math.floor((now-g.t0)/100);
          setScore(g.score);
          // Draw
          const ctx=cv.getContext("2d");
          ctx.fillStyle="#0f172a"; ctx.fillRect(0,0,W,H);
          ctx.strokeStyle="rgba(255,255,255,.04)"; ctx.lineWidth=1;
          for(let x=0;x<W;x+=30){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
          for(let y=0;y<H;y+=30){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
          g.bullets.forEach(b=>{
            ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);
            ctx.fillStyle=b.c; ctx.shadowBlur=8; ctx.shadowColor=b.c; ctx.fill(); ctx.shadowBlur=0;
          });
          ctx.beginPath();ctx.arc(g.px,g.py,8,0,Math.PI*2);
          ctx.fillStyle="#60a5fa"; ctx.shadowBlur=14; ctx.shadowColor="#60a5fa"; ctx.fill(); ctx.shadowBlur=0;
          ctx.strokeStyle="#fff"; ctx.lineWidth=2; ctx.stroke();
          ctx.fillStyle="#fff"; ctx.font="bold 14px sans-serif"; ctx.textAlign="right";
          ctx.fillText(g.score+"점",W-8,20);
          if(g.alive) loop.current=requestAnimationFrame(tick);
          else{setPhase("dead");saveScore(g.score);}
        };
        loop.current=requestAnimationFrame(tick);
      };

      const moveByMouse=(e)=>{
        if(phase!=="playing"||!cvs.current) return;
        const r=cvs.current.getBoundingClientRect();
        const sc=cvs.current.width/r.width;
        const src=e.touches?e.touches[0]:e;
        gs.current.px=(src.clientX-r.left)*sc;
        gs.current.py=(src.clientY-r.top)*sc;
      };

      useEffect(()=>()=>cancelAnimationFrame(loop.current),[]);
      const W=Math.min(330,window.innerWidth-32), H=Math.round(W*1.1);

      return (
        <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:10}}>
          <div style={{position:"relative",borderRadius:12,overflow:"hidden",boxShadow:"0 8px 32px rgba(0,0,0,.4)"}}>

            {phase!=="playing"&&(
              <div style={{position:"absolute",inset:0,background:"rgba(15,23,42,.85)",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:14}}>

                {phase==="ready"&&<p style={{color:"#fff",fontSize:15,textAlign:"center",padding:"0 20px"}}>파란 점이 플레이어! 마우스/조이스틱으로 총알 피하세요</p>}
                <button className="btn-primary" onClick={start} style={{fontSize:15,padding:"10px 28px"}}>{phase==="dead"?"다시시작":"시작"}</button>
              </div>

            <VirtualJoystick onMove={v=>{joy.current=v;}} />
            <div style={{color:"#64748b",fontSize:11,textAlign:"center"}}>
              <div>마우스/터치:</div><div>직접 이동</div>
              <div style={{marginTop:4}}>조이스틱:</div><div>방향 이동</div>
            </div>
          </div>

    function PoopGame({ myIp, board, saveScore }) {
      const cvs  = React.useRef(null);
      const loop = React.useRef(null);
      const gs   = React.useRef({});
      const [phase,    setPhase]    = useState("ready");
      const [score,    setScore]    = useState(0);
      const [lives,    setLives]    = useState(3);
      const [invLeft,  setInvLeft]  = useState(0);
      const joyRef = React.useRef({dx:0});

      const useSkill = () => {
        const g=gs.current; if(!g.alive||g.invincible>0) return;
        g.invincible=60; // 60 frames = 1 second
      };

      const start = () => {
        const cv=cvs.current; if(!cv) return;
        const W=cv.width,H=cv.height;
        const g={
          px:W/2,vx:0,poops:[],alive:true,score:0,lives:3,
          lastSpawn:0,interval:900,invincible:0,flashFrame:0,
          t0:performance.now(),frame:0
        };
        gs.current=g;
        setPhase("playing"); setScore(0); setLives(3); setInvLeft(0);
        cancelAnimationFrame(loop.current);

        const drawStickman=(ctx,x,y,inv)=>{
          const col = inv>0 ? (Math.floor(g.frame/4)%2===0?"#f59e0b":"#fff") : "#60a5fa";
          ctx.strokeStyle=col; ctx.lineWidth=2.5; ctx.fillStyle=col;
          // Head
          ctx.beginPath(); ctx.arc(x,y-26,9,0,Math.PI*2); ctx.fill();
          // Body
          ctx.beginPath(); ctx.moveTo(x,y-17); ctx.lineTo(x,y); ctx.stroke();
          // Arms
          ctx.beginPath(); ctx.moveTo(x-12,y-10); ctx.lineTo(x,y-14); ctx.lineTo(x+12,y-10); ctx.stroke();
          // Legs
          ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x-10,y+16); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+10,y+16); ctx.stroke();
          // Smile
          ctx.strokeStyle=inv>0?"#0f172a":col; ctx.lineWidth=1.5;
          ctx.beginPath(); ctx.arc(x,y-28,4,0.2,Math.PI-0.2); ctx.stroke();
        };

        const tick=(now)=>{
          g.frame++;
          const W=cv.width,H=cv.height;
          // Joystick move
          g.vx += joyRef.current.dx * 0.8;
          g.vx *= 0.75;
          g.px = Math.max(18,Math.min(W-18,g.px+g.vx));
          // Spawn poop
          if(now-g.lastSpawn>g.interval){
            g.lastSpawn=now; g.interval=Math.max(350,900-g.score*5);
            g.poops.push({x:Math.random()*(W-30)+15,y:-10,spd:2+g.score*0.05+Math.random()*1.5});
          }
          g.poops.forEach(p=>p.y+=p.spd);
          if(g.invincible>0){g.invincible--;setInvLeft(g.invincible);}
          // Collision + remove
          const py=H-50;
          g.poops=g.poops.filter(p=>{
            if(p.y>H+10){return false;}
            if(g.invincible===0){
              const dx=p.x-g.px,dy=p.y-py;
              if(Math.sqrt(dx*dx+dy*dy)<20){
                g.lives--;setLives(g.lives);
                if(g.lives<=0){g.alive=false;}
                return false;
              }
            }
            return true;
          });
          g.score=Math.floor((now-g.t0)/100);
          setScore(g.score);
          // Draw
          const ctx=cv.getContext("2d");
          // Sky bg
          const sky=ctx.createLinearGradient(0,0,0,H);
          sky.addColorStop(0,"#1e3a5f"); sky.addColorStop(1,"#0f1923");
          ctx.fillStyle=sky; ctx.fillRect(0,0,W,H);
          // Ground
          ctx.fillStyle="#1a4731"; ctx.fillRect(0,H-20,W,20);
          ctx.fillStyle="#22543d"; ctx.fillRect(0,H-22,W,4);
          // Poops
          ctx.font="22px serif";
          g.poops.forEach(p=>{ctx.fillText("💩",p.x-11,p.y+8);});
          // Stickman
          drawStickman(ctx,g.px,H-24,g.invincible);
          // HUD
          ctx.fillStyle="#fff"; ctx.font="bold 13px sans-serif"; ctx.textAlign="left";
          ctx.fillText("❤️".repeat(g.lives),6,20);
          ctx.textAlign="right";
          ctx.fillText(g.score+"점",W-6,20);
          if(g.invincible>0){
            ctx.fillStyle="#f59e0b"; ctx.textAlign="center"; ctx.font="bold 12px sans-serif";
            ctx.fillText("⚡ 무적! "+Math.ceil(g.invincible/60)+"초",W/2,H/2);
          }
          if(g.alive) loop.current=requestAnimationFrame(tick);
          else{setPhase("dead");saveScore(g.score);}
        };
        loop.current=requestAnimationFrame(tick);
      };

      useEffect(()=>()=>cancelAnimationFrame(loop.current),[]);
      const W=Math.min(330,window.innerWidth-32), H=Math.round(W*1.1);

      return (
        <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:10}}>
          <div style={{position:"relative",borderRadius:12,overflow:"hidden",boxShadow:"0 8px 32px rgba(0,0,0,.4)"}}>
            <canvas ref={cvs} width={W} height={H} style={{display:"block"}} />
            {phase!=="playing"&&(
              <div style={{position:"absolute",inset:0,background:"rgba(15,23,42,.88)",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:14}}>
                {phase==="dead"&&<><p style={{color:"#ef4444",fontSize:20,fontWeight:800}}>💀 GAME OVER</p><p style={{color:"#fff",fontSize:32,fontWeight:900}}>{score}점</p></>}
                {phase==="ready"&&<div style={{textAlign:"center",padding:"0 20px"}}><p style={{color:"#fff",fontSize:15,marginBottom:8}}>졸라맨이 💩을 피하세요!</p><p style={{color:"#f59e0b",fontSize:12}}>⚡ 필살기 버튼: 1초 무적</p></div>}
                <button className="btn-primary" onClick={start} style={{fontSize:15,padding:"10px 28px"}}>{phase==="dead"?"다시시작":"시작"}</button>
              </div>
            )}
          </div>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",width:W,gap:12}}>
            <VirtualJoystick onMove={v=>{joyRef.current={dx:v.dx};}} />
            <button onClick={useSkill}
              style={{flex:1,padding:"14px",background: invLeft>0?"#94a3b8":"linear-gradient(135deg,#f59e0b,#ef4444)",
                color:"#fff",border:"none",borderRadius:12,fontSize:16,fontWeight:800,cursor:"pointer",
                boxShadow:"0 4px 12px rgba(239,68,68,.4)",opacity:invLeft>0?.5:1}}>
              ⚡ 필살기{invLeft>0?" ("+Math.ceil(invLeft/60)+"초)":""}
            </button>
          </div>
        </div>
      );
    }

      useEffect(() => {
        if (!window.IS_FB) return;

    function PriceChart({ prop }) {
      const [loading,  setLoading]  = useState(false);
      const [txData,   setTxData]   = useState([]);
      const [error,    setError]    = useState("");
      const [fetched,  setFetched]  = useState(false);

      const chartInst = React.useRef(null);

      useEffect(() => {
        if (prop.dongCode && prop.dongCode.length===5 && IS_GOV_API) fetchData();
      }, []);

      const fetchData = async () => {
        if (!prop.dongCode || prop.dongCode.length !== 5) {
          setError("법정동코드(5자리)를 먼저 수정 화면에서 입력해주세요");
          return;
        }
        if (!IS_GOV_API) {
          setError("data.go.kr API 키를 index.html 상단 GOV_API_KEY에 입력해주세요");
          return;
        }
        setLoading(true); setError(""); setTxData([]);
        let fetchErrors = 0;
        const results = [];
        const now = new Date();
        const proxies = [
          (url) => url,                                                                    // 직접 fetch
          (url) => "https://corsproxy.io/?" + encodeURIComponent(url),
          (url) => "https://api.allorigins.win/raw?url=" + encodeURIComponent(url),
          (url) => "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(url),
        ];
        let workingProxy = null;

        for (let i = 0; i < 36; i++) {
          const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
          const ym = d.getFullYear() + String(d.getMonth()+1).padStart(2,"0");
          const apiUrl = "https://apis.data.go.kr/1613000/RTMSDataSvcAptTradeDev/getRTMSDataSvcAptTradeDev" +
            "?serviceKey=" + GOV_API_KEY +
            "&LAWD_CD=" + prop.dongCode +
            "&DEAL_YMD=" + ym + "&numOfRows=100&pageNo=1";

          let xmlStr = "";
          const tryList = workingProxy ? [workingProxy] : proxies;
          for (const proxyFn of tryList) {
            try {
              const r = await fetch(proxyFn(apiUrl), {signal:AbortSignal.timeout(12000)});
              if (!r.ok) continue;
              const t = await r.text();
              const raw = t.includes('"contents"') ? (JSON.parse(t).contents||"") : t;
              if (raw.includes("<item>") || raw.includes('"아파트"')) {
                xmlStr = raw; workingProxy = proxyFn; break;
              }
            } catch {}
          }
          if (!xmlStr) continue;

          try {
            // JSON 응답 처리
            if (xmlStr.includes('"item"')) {
              const j = JSON.parse(xmlStr);
              const arr = j?.response?.body?.items?.item;
              const items = Array.isArray(arr) ? arr : (arr ? [arr] : []);
              items.forEach(item => {
                const name  = (item["아파트"]||"").trim();
                const price = parseInt((item["거래금액"]||"0").replace(/,/g,""));
                const area  = parseFloat(item["전용면적"]||"0");
                const year  = String(item["년"]||"");
                const month = String(item["월"]||"");
                const key = prop.buildingName.replace(/\s/g,"").slice(0,3);
                if (name && name.includes(key)) {
                  results.push({ym, year, month, area:Math.round(area/3.305)||Math.round(area), price:price/10000});
                }
              });
            } else {
              // XML 파싱
              const parser = new DOMParser();
              const doc = parser.parseFromString(xmlStr,"text/xml");
              doc.querySelectorAll("item").forEach(el => {
                const g = tag => (el.querySelector(tag)?.textContent||"").trim();
                const name  = g("아파트");
                const price = parseInt((g("거래금액")||"0").replace(/,/g,""));
                const area  = parseFloat(g("전용면적")||"0");
                const year  = g("년"); const month = g("월");
                const key = prop.buildingName.replace(/\s/g,"").slice(0,3);
                if (name && name.includes(key)) {
                  results.push({ym, year, month, area:Math.round(area/3.305)||Math.round(area), price:price/10000});
                }
              });
            }
          } catch(pe) { console.warn("parse err:", pe); }
        }
        results.sort((a,b)=>a.ym.localeCompare(b.ym));
        setTxData(results);
        setFetched(true);
        setLoading(false);
      };

      useEffect(() => {
        if (!fetched || txData.length===0 || !chartRef.current) return;
        if (chartInst.current) chartInst.current.destroy();
        const labels = [...new Set(txData.map(t=>`${t.year}.${String(t.month).padStart(2,"0")}`))];
        const avgByMonth = labels.map(lbl => {
          const items = txData.filter(t=>`${t.year}.${String(t.month).padStart(2,"0")}`===lbl);
          return Math.round(items.reduce((s,i)=>s+i.price,0)/items.length);
        });
        chartInst.current = new Chart(chartRef.current, {
          type:"line",
          data:{
            labels,
            datasets:[{
              label:"평균 실거래가 (만원)",
              data:avgByMonth,
              borderColor:"#1d4ed8",
              backgroundColor:"rgba(29,78,216,.08)",
              tension:0.3, fill:true,
              pointBackgroundColor:"#1d4ed8", pointRadius:4
            }]
          },
          options:{
            responsive:true, maintainAspectRatio:false,
            plugins:{ legend:{ display:false } },
            scales:{
              y:{ ticks:{ callback: v => v>=10000?`${Math.round(v/10000)}억`:v+"만" } },
              x:{ ticks:{ maxRotation:45 } }
            }
          }
        });
      }, [txData, fetched]);

      return (
        <div className="card" style={{padding:24,marginBottom:16}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
            <div>
              <p className="section-label" style={{marginBottom:4}}>실거래가 히스토리 (최근 3년)</p>
              {prop.dongCode ? <span className="tag tag-blue">법정동코드: {prop.dongCode}</span>
                : <span className="tag tag-orange">⚠️ 수정 화면에서 법정동코드 입력 필요</span>}
            </div>
            <button className="btn-secondary" onClick={fetchData} disabled={loading}
              style={{fontSize:13,padding:"8px 16px",opacity:loading?.6:1}}>
              {loading?"조회 중...":"🔄 새로고침"}
            </button>
          </div>
          {error && <p style={{color:"#dc2626",fontSize:13,marginBottom:12,padding:"10px 14px",background:"#fee2e2",borderRadius:8}}>{error}</p>}
          {!IS_GOV_API && !error && (
            <div style={{padding:"20px",background:"#f8fafc",borderRadius:10,border:"2px dashed #e2e8f0",textAlign:"center"}}>
              <p style={{fontSize:13,color:"#94a3b8",lineHeight:1.7}}>
                📋 <strong>data.go.kr</strong>에서 <strong>"아파트매매 실거래 상세 자료"</strong> API 키 발급 후<br/>
                index.html 상단 <code style={{background:"#f1f5f9",padding:"1px 6px",borderRadius:4}}>GOV_API_KEY</code> 에 입력하면 활성화됩니다
              </p>

          {fetched && txData.length===0 && <p style={{color:"#94a3b8",fontSize:13,textAlign:"center",padding:"20px 0"}}>해당 아파트의 거래 데이터가 없습니다</p>}
          {fetched && txData.length>0 && (
            <div style={{height:280,position:"relative"}}><canvas ref={chartRef}></canvas></div>

    function ApartmentSearch({ onSelect }) {
      const [q, setQ]           = useState("");
      const [results, setResults] = useState([]);
      const [loading, setLoading] = useState(false);
      const [open, setOpen]       = useState(false);

      const waitKakao = (cb, retry=0) => {
        if (window.__kakaoReady && window.kakao && window.kakao.maps) { cb(); return; }
        if (retry > 30) { alert("카카오맵 로드 실패. 페이지를 새로고침해주세요."); setLoading(false); return; }
        setTimeout(() => waitKakao(cb, retry+1), 300);
      };

      const search = () => {
        if (!q.trim()) return;
        setLoading(true);
        waitKakao(() => {
          const ps = new kakao.maps.services.Places();
          ps.keywordSearch(q + " 아파트", (data, status) => {
            setLoading(false);
            if (status === kakao.maps.services.Status.OK) {
              setResults(data.slice(0, 6));
              setOpen(true);
            } else {
              setResults([]);
              alert("검색 결과가 없습니다.");
            }
          }, { size: 6 });
        });
      };

      const pick = (r) => {
        const addr = r.road_address_name || r.address_name;
        onSelect({
          buildingName: r.place_name.replace(/\s*아파트$/, ""),
          address: addr,
          lat: parseFloat(r.y),
          lng: parseFloat(r.x),
          dongCode: getDongCode(addr),
        });
        setQ(""); setResults([]); setOpen(false);
      };

      return (
        <div style={{position:"relative"}}>
          <div style={{display:"flex",gap:8}}>
            <input className="input-field" placeholder="🔍 아파트명으로 검색" value={q}
              onChange={e=>setQ(e.target.value)} onKeyDown={e=>e.key==="Enter"&&search()} style={{flex:1}} />

              {loading ? "검색중..." : "검색"}
            </button>
          </div>

    function App() {
      const [auth,        setAuth]        = useState(false);
      const [properties,  setProperties]  = useState([]);
      const [view,        setView]        = useState("list");
      const [selected,    setSelected]    = useState(null);
      const [editing,     setEditing]     = useState(null);
      const [sidebarOpen, setSidebarOpen] = useState(window.innerWidth > 900);
      const [homeTab, setHomeTab]         = useState("list"); // "list" | "map"
      const [isMobile,    setIsMobile]    = useState(window.innerWidth <= 900);
      const [myIp,        setMyIp]        = useState("");
      const [adminOpen,   setAdminOpen]   = useState(false);

      useEffect(() => {
        const h = () => {
          const mobile = window.innerWidth <= 900;
          setIsMobile(mobile);
          if (mobile) setSidebarOpen(false);
        };
        window.addEventListener("resize", h);
        return () => window.removeEventListener("resize", h);
      }, []);

      // 앱 시작 시 카카오맵 SDK 미리 로딩
      useEffect(() => {
        if (window.kakao && window.kakao.maps) { window.__kakaoReady = true; return; }
        if (document.querySelector('script[data-kakao]')) return;
        const s = document.createElement('script');
        s.setAttribute('data-kakao', 'true');
        s.src = 'https://dapi.kakao.com/v2/maps/sdk.js?appkey=417d5280c5db719799c86b99168879b5&libraries=services&autoload=false';
        s.onload = () => kakao.maps.load(() => { window.__kakaoReady = true; });
        document.head.appendChild(s);
      }, []);

      /* IP 트래킹 */
      useEffect(() => {
        if (!auth) return;
        fetch("https://api.ipify.org?format=json")
          .then(r => r.json())
          .then(({ ip }) => {
            setMyIp(ip);
            if (!window.IS_FB) return;
            const safeIp = ip.replace(/\./g, "_");
            window.db.collection("visitors").doc(safeIp).get().then(doc => {
              if (!doc.exists) {
                const name = window.prompt("👋 처음 오셨네요! 이름을 입력해주세요:") || "익명";
                window.db.collection("visitors").doc(safeIp).set({
                  ip, name, firstVisit: new Date().toISOString(),
                  lastVisit: new Date().toISOString(), visits: 1
                });
              } else {
                window.db.collection("visitors").doc(safeIp).update({
                  lastVisit: new Date().toISOString(),
                  visits: firebase.firestore.FieldValue.increment(1)
                });
              }
            });
          }).catch(() => {});
      }, [auth]);

      /* Data loading */
      useEffect(() => {
        if (!auth) return;

        if (!window.IS_FB) {
          setProperties(lsGet());
          return;
        }

        const unsub = window.db.collection("properties")
          .orderBy("createdAt", "desc")
          .onSnapshot(snap => {
            setProperties(snap.docs.map(d => ({ ...d.data(), id: d.id })));
          }, err => console.error("Firestore error:", err));

        return () => unsub();
      }, [auth]);

      /* CRUD */
      const saveProp = async (prop) => {
        if (!window.IS_FB) {
          const next = editing
            ? properties.map(p => p.id===prop.id ? prop : p)
            : [prop, ...properties];
          setProperties(next);
          lsSet(next);
        } else {
          await window.db.collection("properties").doc(prop.id).set(prop);
        }
        if (editing) { setSelected(prop); setView("detail"); }
        else { setView("list"); }
        setEditing(null);
      };

      const deleteProp = async (id) => {
        if (!window.IS_FB) {
          const next = properties.filter(p => p.id!==id);
          setProperties(next);
          lsSet(next);
        } else {
          await window.db.collection("properties").doc(id).delete();
        }
        setSelected(null);
        setView("list");
      };

      const go = (v) => { setView(v); setSelected(null); setEditing(null); };

      if (!auth) return <PasswordGate onSuccess={()=>setAuth(true)} />;

      return (
        <div style={{display:"flex",minHeight:"100vh",position:"relative"}}>
          <FontLoader />

          {/* 사이드바 오버레이 (모바일 백드롭) */}
          {sidebarOpen && isMobile && (
            <div onClick={()=>setSidebarOpen(false)}
              style={{position:"fixed",inset:0,background:"rgba(0,0,0,.55)",zIndex:40}} />
          )}

          {/* 사이드바 - fixed 포지션, 토글 */}
          {sidebarOpen && (
            <div style={{
              position:"fixed",top:0,left:0,bottom:0,width:220,
              background:"#0c1829",zIndex:50,display:"flex",
              flexDirection:"column",padding:"20px 12px",overflowY:"auto",
              boxShadow:"4px 0 20px rgba(0,0,0,.3)"
            }}>
              {/* X 닫기 버튼 */}
              <button onClick={()=>setSidebarOpen(false)}
                style={{alignSelf:"flex-end",background:"transparent",border:"none",
                  color:"#64748b",fontSize:20,cursor:"pointer",marginBottom:8,lineHeight:1,padding:4}}>✕</button>
              <Sidebar view={view} setView={v=>{go(v); if(isMobile) setSidebarOpen(false);}}
                count={properties.length}
                onAdd={()=>{setEditing(null);setView("form"); if(isMobile) setSidebarOpen(false);}}
                onClose={()=>setSidebarOpen(false)} />
            </div>
          )}

          {/* 메인 콘텐츠 - 데스크탑에서 사이드바 열리면 오른쪽으로 밀림 */}
          <main style={{
            flex:1, minWidth:0, overflow:"auto", background:"#f0f4f9",
            marginLeft: sidebarOpen && !isMobile ? 220 : 0,
            transition:"margin-left .25s ease"
          }}>
            {/* 상단 바 - 항상 표시 (☰ 버튼) */}
            <div style={{
              display:"flex",alignItems:"center",gap:12,padding:"12px 16px",
              background:"#0c1829",position:"sticky",top:0,zIndex:30,
              boxShadow:"0 2px 8px rgba(0,0,0,.2)"
            }}>
              <button onClick={()=>setSidebarOpen(v=>!v)}
                style={{background:"transparent",border:"none",color:"#fff",
                  fontSize:22,cursor:"pointer",lineHeight:1,padding:"2px 6px",
                  borderRadius:6,transition:"background .2s"}}
                title={sidebarOpen?"메뉴 닫기":"메뉴 열기"}>☰</button>
              <span style={{color:"#fff",fontWeight:700,fontSize:15,flex:1}}>🏠 임장 히스토리</span>
              <button onClick={()=>{setEditing(null);setView("form");setSidebarOpen(false);}}
                style={{background:"#1d4ed8",color:"#fff",border:"none",borderRadius:8,
                  padding:"7px 14px",fontSize:13,fontWeight:600,cursor:"pointer"}}>+ 추가</button>
            </div>

            {/* 콘텐츠 */}
            {(view==="list"||view==="map") && (
              <div>
                {/* 목록/지도 토글 */}
                <div style={{padding:"12px 16px 8px",display:"flex",justifyContent:"center"}}>
                  <div className="view-toggle">
                    <button className={`view-toggle-btn${homeTab==="list"?" active":""}`} onClick={()=>setHomeTab("list")}>☰ 목록</button>
                    <button className={`view-toggle-btn${homeTab==="map"?" active":""}`}  onClick={()=>setHomeTab("map")}>🗺 지도</button>
                  </div>
                </div>
                {homeTab==="list"
                  ? <ListView properties={properties} onSelect={p=>{setSelected(p);setView("detail");}} onEdit={p=>{setEditing(p);setView("form");}} onDelete={id=>deleteProp(id)} onAdd={()=>{setEditing(null);setView("form");}} />
                  : <MapFullscreen properties={properties} onSelect={p=>{setSelected(p);setView("detail");}} />
                }
              </div>
            )}
            {view==="admin" && <AdminView onBack={()=>setView("list")} myIp={myIp} />}
            {view==="game"  && <BulletGameTab myIp={myIp} />}
            {view==="detail" && selected && <DetailView prop={selected} onEdit={()=>{setEditing(selected);setView("form");}} onDelete={()=>deleteProp(selected.id)} onBack={()=>go("list")} />}
            {view==="form" && <PropertyForm initial={editing} onSave={saveProp} onCancel={()=>{setEditing(null);setView(editing?"detail":"list");}} />}
            {/* 하단 네비게이션 */}
            <nav className="bottom-nav">
              {[
                {id:"list", icon:"🏠", label:"목록"},
                {id:"map",  icon:"🗺", label:"지도", tab:"map"},
                {id:"add",  icon:"➕", label:"추가"},
                {id:"game", icon:"🎮", label:"게임"},
                {id:"admin",icon:"🔐", label:"관리"},
              ].map(btn=>(
                <button key={btn.id} className={`bnav-btn${view===btn.id?" active":""}`}
                  onClick={()=>{
                    if(btn.id==="add"){setEditing(null);setView("form");setSidebarOpen(false);}
                    else{
                      if(btn.tab){setHomeTab(btn.tab);go("list");}
                      else{go(btn.id);}
                      setSidebarOpen(false);
                    }
                  }}>
                  <span className="bnav-icon">{btn.icon}</span>
                  <span>{btn.label}</span>
                </button>
              ))}
            </nav>
          </main>
        </div>
      );
    }

    function MobilePreviewWrapper() {
      if (!MOBILE_PREVIEW) return <App />;
      return (
        <div style={{minHeight:"100vh",background:"#1a1a2e",display:"flex",alignItems:"flex-start",justifyContent:"center",padding:"40px 20px",gap:20}}>
          <div style={{position:"sticky",top:40}}>
            <p style={{color:"#94a3b8",fontSize:12,marginBottom:8,textAlign:"center"}}>갤럭시 S25 미리보기</p>
            <div style={{width:360,height:780,border:"8px solid #333",borderRadius:40,overflow:"hidden",boxShadow:"0 24px 64px rgba(0,0,0,.5)",background:"#fff",position:"relative"}}>
              <div style={{position:"absolute",top:0,left:"50%",transform:"translateX(-50%)",width:80,height:8,background:"#333",borderRadius:"0 0 8px 8px",zIndex:10}}></div>
              <div style={{width:"100%",height:"100%",overflowY:"auto",overflowX:"hidden"}}>
                <App />
              </div>
            </div>
            <p style={{color:"#475569",fontSize:11,textAlign:"center",marginTop:12}}>360 × 780 px</p>
          </div>
        </div>
      );
    }

async function generateAiSummary(prop) {
      if (!IS_AI) return null;
      const models = ["gemini-2.0-flash", "gemini-1.5-flash", "gemini-1.5-flash-8b"];
      const wStr = Object.entries(locationWeights).map(([k,v])=>k+":"+v).join(",");
      const infra = prop.infrastructure.map(i=>i.label).join(",") || "없음";
      const prompt = "아파트 입지를 평가해서 JSON으로만 응답. 다른말 없이 JSON만. " +
        "아파트명:" + prop.buildingName + " 주소:" + prop.address + " " +
        "가격:" + (formatPrice(prop.price)||"미입력") + " " + (prop.size||"?") + "평 " +
        "준공:" + (prop.constructionYear||"미상") + "년 인프라:" + infra + " " +
        "가중치(" + wStr + ") " +
        'JSON형식(점수는0~10): {"rating":8.5,"summary":"50자이내평가","scores":{"역세권":8,"학군":7,"교통":8,"편의시설":7,"자연환경":6,"주차":6,"단지규모":8,"브랜드":7}}';
      for (const model of models) {
        try {
          const url = "https://generativelanguage.googleapis.com/v1/models/" + model + ":generateContent?key=" + GEMINI_KEY;
          const res = await fetch(url, {
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body: JSON.stringify({contents:[{parts:[{text:prompt}]}]})
          });
          const data = await res.json();
          if (data.error) { console.warn("Gemini",model,"err:",data.error.message); continue; }
          const raw = (data.candidates?.[0]?.content?.parts?.[0]?.text||"").trim();
          if (!raw) continue;
          const m = raw.match(/\{[\s\S]*\}/);
          if (!m) return {rating:3.0, summary:raw.slice(0,80), scores:{}};
          const json = JSON.parse(m[0]);
          console.log("Gemini OK with", model);
          return json;
        } catch(e) { console.error("Gemini fetch err:", e); }
      }
      return null;
    }
