<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🏠 임장 히스토리</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;900&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Noto Sans KR', sans-serif; background: #f0f4f9; color: #1e293b; -webkit-font-smoothing: antialiased; }
    input, textarea, select, button { font-family: 'Noto Sans KR', sans-serif; }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    @keyframes fadeUp { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
    @keyframes shake  { 0%,100%{transform:translateX(0)} 20%,60%{transform:translateX(-8px)} 40%,80%{transform:translateX(8px)} }
    .fade-up { animation: fadeUp 0.3s ease both; }
    .btn-primary   { background:#1d4ed8; color:#fff; border:none; border-radius:8px; padding:10px 20px; cursor:pointer; font-weight:600; font-size:14px; transition:background .2s; }
    .btn-primary:hover { background:#1e40af; }
    .btn-secondary { background:#f1f5f9; color:#475569; border:1px solid #e2e8f0; border-radius:8px; padding:10px 20px; cursor:pointer; font-weight:500; font-size:14px; transition:all .2s; }
    .btn-secondary:hover { background:#e2e8f0; }
    .btn-danger    { background:#fee2e2; color:#dc2626; border:1px solid #fecaca; border-radius:8px; padding:10px 20px; cursor:pointer; font-weight:500; font-size:14px; }
    .btn-danger:hover { background:#fecaca; }
    .btn-icon { background:transparent; border:none; cursor:pointer; padding:6px; border-radius:6px; display:flex; align-items:center; justify-content:center; transition:background .2s; color:#64748b; font-size:16px; line-height:1; }
    .btn-icon:hover { background:#f1f5f9; }
    .input-field { width:100%; border:1.5px solid #e2e8f0; border-radius:8px; padding:10px 14px; font-size:14px; color:#1e293b; background:#fff; transition:border-color .2s,box-shadow .2s; outline:none; }
    .input-field:focus { border-color:#3b82f6; box-shadow:0 0 0 3px rgba(59,130,246,.12); }
    .textarea-field { width:100%; border:1.5px solid #e2e8f0; border-radius:8px; padding:10px 14px; font-size:14px; color:#1e293b; background:#fff; outline:none; resize:vertical; min-height:100px; line-height:1.7; }
    .textarea-field:focus { border-color:#3b82f6; box-shadow:0 0 0 3px rgba(59,130,246,.12); }
    .card { background:#fff; border-radius:14px; box-shadow:0 1px 4px rgba(0,0,0,.07),0 1px 2px rgba(0,0,0,.05); transition:box-shadow .2s; }
    .prop-card { cursor:pointer; transition:transform .2s,box-shadow .2s; }
    .prop-card:hover { transform:translateY(-3px); box-shadow:0 10px 28px rgba(0,0,0,.13); }
    .tag { display:inline-flex; align-items:center; gap:4px; padding:3px 9px; border-radius:20px; font-size:12px; font-weight:500; }
    .tag-blue   { background:#dbeafe; color:#1d4ed8; }
    .tag-green  { background:#dcfce7; color:#16a34a; }
    .tag-orange { background:#ffedd5; color:#ea580c; }
    .tag-gray   { background:#f1f5f9; color:#475569; }
    .sidebar-link { display:flex; align-items:center; gap:10px; padding:10px 14px; border-radius:8px; cursor:pointer; color:#94a3b8; font-size:14px; font-weight:500; border:none; background:transparent; width:100%; text-align:left; transition:all .2s; }
    .sidebar-link:hover { background:rgba(255,255,255,.08); color:#fff; }
    .sidebar-link.active { background:rgba(59,130,246,.18); color:#60a5fa; }
    .section-label { font-size:11px; font-weight:700; color:#94a3b8; text-transform:uppercase; letter-spacing:.08em; margin-bottom:14px; padding-bottom:8px; border-bottom:1px solid #f1f5f9; }
    .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.5); display:flex; align-items:center; justify-content:center; z-index:1000; }
    .modal-box { background:#fff; border-radius:18px; padding:32px; width:90%; max-width:380px; box-shadow:0 24px 64px rgba(0,0,0,.25); animation:fadeUp .25s ease; }
    .firebase-badge { display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:12px; font-size:11px; font-weight:600; }
    .firebase-on  { background:#dcfce7; color:#16a34a; }
    .firebase-off { background:#fef9c3; color:#a16207; }
  /* ── 레이아웃 ── */
  .sidebar-col  { width:220px; flex-shrink:0; }
  .main-col     { flex:1; min-width:0; overflow:auto; background:#f0f4f9; }
  .mob-topbar   { display:none; background:#0c1829; padding:13px 16px; align-items:center; gap:12px; position:sticky; top:0; z-index:30; }
  .mob-sidebar  { position:fixed; top:0; left:0; bottom:0; width:260px; background:#0c1829; z-index:50; overflow-y:auto; display:flex; flex-direction:column; padding:24px 12px; box-shadow:4px 0 24px rgba(0,0,0,.4); }
  .mob-overlay  { position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:40; }
  @media (max-width:900px) {
    .sidebar-col  { display:none !important; }
    .mob-topbar   { display:flex !important; }
    .mob-close-x  { display:block !important; }
  }
  @media (max-width:640px) {
    .page-pad    { padding:16px 14px !important; }
    .grid-2col   { grid-template-columns:1fr !important; }
    .card-grid   { grid-template-columns:1fr !important; }
    .detail-hdr  { flex-direction:column !important; }
    .stat-grid   { grid-template-columns:1fr 1fr !important; }
  }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- ★★★ Firebase 설정 - 아래 값들을 본인 Firebase 프로젝트 설정으로 교체하세요 ★★★ -->
  <script>
    const FIREBASE_CONFIG = {
      apiKey:            "AIzaSyDhf6sl94M4cQNmLaGUb_Apf5zRJeTBZaA",
      authDomain:        "im-jang-history.firebaseapp.com",
      projectId:         "im-jang-history",
      storageBucket:     "im-jang-history.firebasestorage.app",
      messagingSenderId: "14812048772",
      appId:             "1:14812048772:web:59b8a8738d6b2fadec81d1"
    };

    window.IS_FB = FIREBASE_CONFIG.apiKey !== "YOUR_API_KEY";

    if (window.IS_FB) {
      firebase.initializeApp(FIREBASE_CONFIG);
      window.db = firebase.firestore();
    }
  </script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    /* ─── CONSTANTS ─── */
    const PASS = "1234";

    /* ─── FONT LOADER ─── */
    function FontLoader() {
      useEffect(() => {
        if (document.querySelector('link[data-font="noto"]')) return;
        const link = document.createElement("link");
        link.rel  = "stylesheet";
        link.href = "https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;900&display=swap";
        link.setAttribute("data-font", "noto");
        document.head.appendChild(link);
      }, []);
      return null;
    }


    /* ─── 법정동코드 자동감지 (서울+경기) ─── */
    const DONG_CODES = {
      // 서울특별시
      "종로구":"11110","중구":"11140","용산구":"11170","성동구":"11200",
      "광진구":"11215","동대문구":"11230","중랑구":"11260","성북구":"11290",
      "강북구":"11305","도봉구":"11320","노원구":"11350","은평구":"11380",
      "서대문구":"11410","마포구":"11440","양천구":"11470","강서구":"11500",
      "구로구":"11530","금천구":"11545","영등포구":"11560","동작구":"11590",
      "관악구":"11620","서초구":"11650","강남구":"11680","송파구":"11710",
      "강동구":"11740",
      // 경기도
      "장안구":"41111","권선구":"41113","팔달구":"41115","영통구":"41117",
      "수정구":"41131","중원구":"41133","분당구":"41135",
      "의정부시":"41150",
      "만안구":"41171","동안구":"41173",
      "부천시":"41190","광명시":"41210","평택시":"41220","동두천시":"41250",
      "상록구":"41271","단원구":"41273",
      "덕양구":"41281","일산동구":"41285","일산서구":"41287",
      "과천시":"41290","구리시":"41310","남양주시":"41360","오산시":"41370",
      "시흥시":"41390","군포시":"41410","의왕시":"41430","하남시":"41450",
      "처인구":"41461","기흥구":"41463","수지구":"41465",
      "파주시":"41480","이천시":"41500","안성시":"41550","김포시":"41570",
      "화성시":"41590","광주시":"41610","양주시":"41630","포천시":"41650",
      "여주시":"41670","연천군":"41800","가평군":"41820","양평군":"41830",
    };

    const getDongCode = (address = "") => {
      // 구 단위로 먼저 (더 정확)
      for (const [key, code] of Object.entries(DONG_CODES)) {
        if (key.endsWith("구") && address.includes(key)) return code;
      }
      // 시·군 단위
      for (const [key, code] of Object.entries(DONG_CODES)) {
        if (address.includes(key)) return code;
      }
      return "";
    };


    const GOV_API_KEY = "b33c6e5b219113eef5c49208c9cf1e1bda30843f7939c1377215c335cd73beff"; // data.go.kr 공공데이터 API 키
    const IS_GOV_API  = GOV_API_KEY !== "YOUR_DATA_GO_KR_API_KEY";

    // 모바일 미리보기 (URL ?mobile=true)
    const URL_PARAMS    = new URLSearchParams(window.location.search);
    const MOBILE_PREVIEW = URL_PARAMS.get("mobile") === "true";
    // Galaxy S25 CSS 기준 크기: 360×780

    const INFRA_SUGGESTIONS = [
      "주차장","초등학교","중학교","고등학교","어린이집","유치원",
      "이마트","홈플러스","롯데마트","코스트코","편의점",
      "병원","약국","공원","도서관","문화센터","버스노선","카페","은행","세탁소"
    ];

    /* ─── UTILS ─── */
    const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);

    const driveImgUrl = (url = "") => {
      const m1 = url.match(/\/d\/([A-Za-z0-9_-]+)/);
      if (m1) return `https://lh3.googleusercontent.com/d/${m1[1]}`;
      const m2 = url.match(/[?&]id=([A-Za-z0-9_-]+)/);
      if (m2) return `https://lh3.googleusercontent.com/d/${m2[1]}`;
      return url;
    };

    // 입력값은 만원 단위 (예: 120000 → 12억원)
    const formatPrice = (val = "") => {
      const n = parseInt(String(val).replace(/[^0-9]/g,""));
      if (!n) return "";
      const eok = Math.floor(n / 10000);
      const man = n % 10000;
      const parts = [];
      if (eok) parts.push(`${eok}억`);
      if (man) parts.push(`${man.toLocaleString()}만`);
      return parts.length ? parts.join(" ") + "원" : `${n.toLocaleString()}만원`;
    };

    const blankProp = () => ({
      id: uid(),
      buildingName:"", address:"", size:"", price:"",
      nearbyStation:"", constructionYear:"",
      infrastructure:[], mediaLinks:[], memo:"",
      lat: null, lng: null,
      propertyType: "임장",   // "임장" | "관심매물"
      dongCode: "",           // 5자리 법정동코드 (실거래가 API용)
      aiSummary: "",
      visitDate: new Date().toISOString().slice(0,10),
      createdAt: new Date().toISOString(),
    });

    /* ─── LOCAL STORAGE HELPERS ─── */
    const lsGet  = () => { try { return JSON.parse(localStorage.getItem("jijang_v1")||"[]"); } catch { return []; } };
    const lsSet  = (v) => { try { localStorage.setItem("jijang_v1", JSON.stringify(v)); } catch {} };

    /* ─── PASSWORD GATE ─── */
    function PasswordGate({ onSuccess }) {
      const [pw, setPw]   = useState("");
      const [err, setErr] = useState(false);

      const submit = () => {
        if (pw === PASS) { onSuccess(); }
        else { setErr(true); setTimeout(()=>{ setErr(false); setPw(""); }, 1500); }
      };

      return (
        <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"linear-gradient(145deg,#0c1829 0%,#1a3050 100%)"}}>
          <div className="fade-up" style={{background:"#fff",borderRadius:22,padding:"52px 44px",width:"100%",maxWidth:420,boxShadow:"0 32px 96px rgba(0,0,0,.35)",animation:err?"shake .45s ease":undefined}}>
            <div style={{textAlign:"center",marginBottom:36}}>
              <div style={{fontSize:52,marginBottom:14}}>🏢</div>
              <h1 style={{fontSize:26,fontWeight:900,color:"#0c1829",marginBottom:8}}>임장 히스토리</h1>
              <p style={{fontSize:14,color:"#64748b",lineHeight:1.5}}>부동산 임장 기록 관리 시스템</p>
            </div>
            {window.IS_FB
              ? <div style={{textAlign:"center",marginBottom:16}}><span className="firebase-badge firebase-on">🔥 Firebase 연결됨 · 데이터 공유 활성화</span></div>
              : <div style={{textAlign:"center",marginBottom:16}}><span className="firebase-badge firebase-off">⚠️ Firebase 미설정 · 이 기기에만 저장</span></div>
            }
            <input className="input-field" type="password" placeholder="비밀번호 입력"
              value={pw} onChange={e=>setPw(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit()}
              style={{textAlign:"center",fontSize:18,letterSpacing:6,borderColor:err?"#ef4444":undefined,marginBottom:8}} autoFocus />
            {err
              ? <p style={{color:"#ef4444",fontSize:13,textAlign:"center",marginBottom:16}}>비밀번호가 틀렸습니다</p>
              : <p style={{color:"#94a3b8",fontSize:12,textAlign:"center",marginBottom:16}}>기본 비밀번호: 1234</p>
            }
            <button className="btn-primary" onClick={submit} style={{width:"100%",padding:14,fontSize:16}}>입장하기</button>
          </div>
        </div>
      );
    }

    /* ─── SIDEBAR ─── */
    function Sidebar({ view, setView, count, onAdd, onClose }) {
      return (
        <aside style={{width:"100%",background:"#0c1829",display:"flex",flexDirection:"column",padding:"24px 12px",minHeight:"100vh",position:"relative"}}>
        <button onClick={onClose} style={{position:"absolute",top:14,right:14,background:"transparent",border:"none",color:"#475569",fontSize:20,cursor:"pointer",lineHeight:1,display:"block"}} className="mob-close-btn">✕</button>
          <div style={{padding:"0 8px",marginBottom:28}}>
            <div style={{fontSize:22,marginBottom:6}}>🏠</div>
            <h2 style={{color:"#fff",fontWeight:800,fontSize:15,lineHeight:1.3}}>임장 히스토리</h2>
            <p style={{color:"#334155",fontSize:11,marginTop:3}}>부동산 탐방 기록</p>
          </div>
          <button className="btn-primary" onClick={onAdd} style={{width:"100%",marginBottom:20,display:"flex",alignItems:"center",gap:6,justifyContent:"center",fontSize:14}}>
            <span style={{fontSize:18,lineHeight:1}}>+</span> 임장 추가
          </button>
          <nav style={{display:"flex",flexDirection:"column",gap:4}}>
            {[{id:"list",icon:"☰",label:"전체 목록",badge:count},{id:"map",icon:"🗺",label:"지도 보기"}].map(l=>(
              <button key={l.id} className={`sidebar-link${view===l.id?" active":""}`} onClick={()=>setView(l.id)}>
                <span>{l.icon}</span>
                <span style={{flex:1}}>{l.label}</span>
                {l.badge!==undefined && <span style={{background:"rgba(255,255,255,.1)",color:"#94a3b8",fontSize:11,padding:"2px 8px",borderRadius:12,fontWeight:700}}>{l.badge}</span>}
              </button>
            ))}
            <button className={`sidebar-link${view==="admin"?" active":""}`} onClick={()=>setView("admin")} style={{marginTop:8,borderTop:"1px solid #1e2d3d",paddingTop:12}}>
              <span>🔐</span><span style={{flex:1}}>관리자</span>
            </button>
          </nav>
          <div style={{marginTop:"auto",padding:"0 8px"}}>
            <div style={{borderTop:"1px solid #1e2d3d",paddingTop:16}}>
              {window.IS_FB
                ? <p style={{color:"#16a34a",fontSize:11,fontWeight:600}}>🔥 Firebase 연결됨<br/><span style={{color:"#334155",fontWeight:400}}>데이터 실시간 공유 중</span></p>
                : <p style={{color:"#a16207",fontSize:11,fontWeight:600}}>⚠️ Firebase 미설정<br/><span style={{color:"#334155",fontWeight:400}}>index.html에 설정 필요</span></p>
              }
            </div>
          </div>
        </aside>
      );
    }

    /* ─── PROPERTY CARD ─── */
    function PropertyCard({ prop, onSelect, onEdit, onDelete }) {
      const [menu, setMenu] = useState(false);
      return (
        <div className="card prop-card fade-up" onClick={()=>onSelect(prop)} style={{padding:22,position:"relative"}}>
          <div onClick={e=>{e.stopPropagation();setMenu(!menu);}} style={{position:"absolute",top:14,right:14}}>
            <button className="btn-icon" style={{fontSize:20,color:"#cbd5e1"}}>⋯</button>
            {menu && (<>
              <div style={{position:"fixed",inset:0,zIndex:5}} onClick={e=>{e.stopPropagation();setMenu(false);}} />
              <div style={{position:"absolute",top:"100%",right:0,zIndex:10,background:"#fff",borderRadius:10,padding:6,boxShadow:"0 8px 28px rgba(0,0,0,.14)",width:120}}>
                <button className="btn-icon" onClick={e=>{e.stopPropagation();setMenu(false);onEdit(prop);}} style={{width:"100%",justifyContent:"flex-start",padding:"8px 12px",fontSize:13,color:"#1e293b",gap:8}}>✏️ 수정</button>
                <button className="btn-icon" onClick={e=>{e.stopPropagation();setMenu(false);onDelete(prop.id);}} style={{width:"100%",justifyContent:"flex-start",padding:"8px 12px",fontSize:13,color:"#dc2626",gap:8}}>🗑 삭제</button>
              </div>
            </>)}
          </div>
          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:5,paddingRight:36}}>
            <h3 style={{fontWeight:700,fontSize:16,color:"#0f172a",lineHeight:1.35,flex:1}}>
              {prop.buildingName || <span style={{color:"#94a3b8"}}>이름 없음</span>}
            </h3>
            <span style={{fontSize:10,fontWeight:700,padding:"2px 7px",borderRadius:10,flexShrink:0,
              background:prop.propertyType==="관심매물"?"#fef9c3":"#dbeafe",
              color:prop.propertyType==="관심매물"?"#a16207":"#1d4ed8"}}>
              {prop.propertyType==="관심매물"?"👁 관심":"🏃 임장"}
            </span>
          </div>
          <p style={{fontSize:13,color:"#64748b",marginBottom:14}}>{prop.address||"주소 없음"}</p>
          <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:14}}>
            {prop.size             && <span className="tag tag-blue">{prop.size}평</span>}
            {prop.price            && <span className="tag tag-green">💰 {formatPrice(prop.price)}</span>}
            {prop.nearbyStation    && <span className="tag tag-gray">🚇 {prop.nearbyStation}</span>}
            {prop.constructionYear && <span className="tag tag-orange">{prop.constructionYear}년</span>}
          </div>
          {prop.infrastructure.length>0 && (
            <div style={{display:"flex",gap:4,flexWrap:"wrap",marginBottom:12}}>
              {prop.infrastructure.slice(0,5).map(i=>(
                <span key={i.id} style={{fontSize:11,color:"#64748b",background:"#f8fafc",padding:"2px 7px",borderRadius:5,border:"1px solid #f1f5f9"}}>{i.label}</span>
              ))}
              {prop.infrastructure.length>5 && <span style={{fontSize:11,color:"#94a3b8"}}>+{prop.infrastructure.length-5}</span>}
            </div>
          )}
          <div style={{borderTop:"1px solid #f8fafc",paddingTop:10,display:"flex",justifyContent:"space-between"}}>
            <span style={{fontSize:11,color:"#94a3b8"}}>📅 {prop.visitDate}</span>

    /* ─── LIST VIEW ─── */
    function ListView({ properties, onSelect, onEdit, onDelete, onAdd }) {
      const [q,    setQ]    = useState("");
      const [sort, setSort] = useState("newest");
      const [typeFilter, setTypeFilter] = useState("전체");

      const list = properties
        .filter(p => typeFilter==="전체" || (p.propertyType||"임장")===typeFilter)
        .filter(p=>!q||p.buildingName.includes(q)||p.address.includes(q))
        .sort((a,b)=>{
          if(sort==="newest") return new Date(b.createdAt)-new Date(a.createdAt);
          if(sort==="price")  return (parseInt(a.price)||0)-(parseInt(b.price)||0);
          if(sort==="size")   return (parseFloat(a.size)||0)-(parseFloat(b.size)||0);
          return 0;
        });

      return (
        <div style={{padding:"36px 32px",maxWidth:1120,margin:"0 auto"}} className="page-pad">
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-end",marginBottom:28,flexWrap:"wrap",gap:12}}>
            <div>
              <h1 style={{fontSize:26,fontWeight:800,color:"#0f172a"}}>임장 목록</h1>
              <p style={{fontSize:14,color:"#64748b",marginTop:5}}>총 <strong style={{color:"#1d4ed8"}}>{properties.length}</strong>곳 방문 기록</p>
            </div>
            <div style={{display:"flex",gap:8}}>
              <input className="input-field" placeholder="🔍 아파트명·주소 검색" value={q} onChange={e=>setQ(e.target.value)} style={{width:220}} />
              <select className="input-field" value={sort} onChange={e=>setSort(e.target.value)} style={{width:110}}>
                <option value="newest">최신순</option>
                <option value="price">가격순</option>
                <option value="size">평수순</option>
              </select>
            </div>
          </div>
          <div style={{display:"flex",gap:8,marginBottom:20}}>
            {["전체","임장","관심매물"].map(t=>(
              <button key={t} onClick={()=>setTypeFilter(t)}
                style={{padding:"6px 16px",borderRadius:20,border:"1.5px solid",cursor:"pointer",fontSize:13,fontWeight:600,transition:"all .2s",
                  borderColor:typeFilter===t?"#1d4ed8":"#e2e8f0",
                  background:typeFilter===t?"#1d4ed8":"#fff",
                  color:typeFilter===t?"#fff":"#64748b"}}>
                {t==="전체"?`전체 ${properties.length}`:t==="임장"?`🏃 임장 ${properties.filter(p=>(p.propertyType||"임장")==="임장").length}`:`👁 관심 ${properties.filter(p=>p.propertyType==="관심매물").length}`}

          </div>
          {properties.length===0 ? (
            <div className="card" style={{padding:"72px 40px",textAlign:"center"}}>
              <div style={{fontSize:52,marginBottom:18}}>🏢</div>
              <h3 style={{fontSize:20,fontWeight:700,color:"#374151",marginBottom:10}}>아직 임장 기록이 없어요</h3>
              <p style={{color:"#9ca3af",fontSize:14,marginBottom:24}}>첫 번째 임장 기록을 추가해보세요!</p>
              <button className="btn-primary" onClick={onAdd}>+ 첫 임장 추가</button>
            </div>
          ) : (
            <div className="card-grid" style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(300px,1fr))",gap:14}}>
              {list.map(p=><PropertyCard key={p.id} prop={p} onSelect={onSelect} onEdit={onEdit} onDelete={onDelete} />)}

    /* ─── MAP VIEW ─── */
    function MapView({ properties }) {
      const [kakaoReady, setKakaoReady] = useState(false);
      const [loadError, setLoadError] = useState(false);

      useEffect(() => {
        if (window.kakao && window.kakao.maps) { setKakaoReady(true); return; }
        const script = document.createElement('script');
        script.src = 'https://dapi.kakao.com/v2/maps/sdk.js?appkey=417d5280c5db719799c86b99168879b5&libraries=services&autoload=false';
        script.onload = () => { kakao.maps.load(() => setKakaoReady(true)); };
        script.onerror = () => setLoadError(true);
        document.head.appendChild(script);
      }, []);

      useEffect(() => {
        if (!kakaoReady) return;
        const initMap = () => {
          if (!window.kakao || !window.kakao.maps) {
            setTimeout(initMap, 300);
            return;
          }
          const container = document.getElementById("kakao-map");
          if (!container) return;
          const map = new kakao.maps.Map(container, {
            center: new kakao.maps.LatLng(37.5665, 126.9780), level: 9
          });
          map.addControl(new kakao.maps.ZoomControl(), kakao.maps.ControlPosition.RIGHT);
          map.addControl(new kakao.maps.MapTypeControl(), kakao.maps.ControlPosition.TOPLEFT);

          const bounds = new kakao.maps.LatLngBounds();
          let hasMarker = false;
          let openOverlay = null;

          properties.forEach(prop => {
            if (!prop.lat || !prop.lng) return;
            const pos = new kakao.maps.LatLng(prop.lat, prop.lng);
            bounds.extend(pos);
            hasMarker = true;
            // 작은 컬러 점 마커 (임장=파랑, 관심=주황)
            const dotColor = prop.propertyType==="관심매물" ? "#f59e0b" : "#2563eb";
            const dotEl = document.createElement("div");
            dotEl.innerHTML = `<div style="width:14px;height:14px;border-radius:50%;background:${dotColor};border:2.5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.4);cursor:pointer;transform:translate(-50%,-50%)"></div>`;
            const dotMarker = new kakao.maps.CustomOverlay({ content:dotEl, position:pos, zIndex:3 });
            dotMarker.setMap(map);
            // 클릭 이벤트
            dotEl.addEventListener("click", () => {
              if (openOverlay) openOverlay.setMap(null);
              if (openOverlay === overlay) { openOverlay = null; return; }
              overlay.setMap(map); openOverlay = overlay;
            });
            const overlay = new kakao.maps.CustomOverlay({
              content: `<div style="background:#fff;border-radius:10px;padding:12px 16px;box-shadow:0 4px 16px rgba(0,0,0,.2);min-width:170px;border-top:3px solid #1d4ed8;font-family:sans-serif">
                <p style="font-weight:700;font-size:14px;color:#0f172a;margin-bottom:4px">${prop.buildingName||"이름없음"}</p>
                <p style="font-size:11px;color:#64748b;margin-bottom:6px">${prop.address||""}</p>
                <p style="font-size:13px;color:#16a34a;font-weight:700;margin-bottom:2px">${prop.price?formatPrice(prop.price):"가격 미입력"}</p>
                ${prop.size?`<p style="font-size:11px;color:#1d4ed8;margin-bottom:4px">${prop.size}평${prop.constructionYear?" · "+prop.constructionYear+"년":""}</p>`:""}
                <p style="font-size:11px;color:#94a3b8;border-top:1px solid #f1f5f9;padding-top:4px;margin-top:2px">📅 임장일: ${prop.visitDate||""}</p>
              </div>`,
              position: pos, yAnchor: 1.45, zIndex: 3
            });
            // 항상 보이는 이름 라벨
            const label = new kakao.maps.CustomOverlay({
              content: `<div style="background:rgba(15,23,42,0.82);color:#fff;padding:3px 8px;border-radius:12px;font-size:10px;font-weight:700;white-space:nowrap;pointer-events:none;box-shadow:0 2px 6px rgba(0,0,0,.3);text-align:center;line-height:1.5;border-left:3px solid ${prop.propertyType==='관심매물'?'#f59e0b':'#2563eb'}">
                <div>${prop.buildingName||"이름없음"}</div>
                ${prop.price?`<div style="color:#86efac;font-size:9px">${formatPrice(prop.price)}</div>`:""}
              </div>`,
              position: pos, yAnchor: -0.2, zIndex: 2
            });
            label.setMap(map);


          });
          if (hasMarker) map.setBounds(bounds);
        };
        initMap();
      }, [kakaoReady, properties]);

      const withCoords = properties.filter(p => p.lat && p.lng);
      const noCoords   = properties.filter(p => !p.lat || !p.lng);

      return (
        <div style={{padding:"36px 32px"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-end",marginBottom:20,flexWrap:"wrap",gap:12}}>
            <div>
              <h1 style={{fontSize:26,fontWeight:800,color:"#0f172a"}}>지도 보기</h1>
              <p style={{fontSize:14,color:"#64748b",marginTop:5}}>마커 클릭 시 상세 정보 · 위치는 임장 추가/수정에서 📍버튼으로 설정</p>
            </div>
            <div style={{display:"flex",gap:8}}>
              <span className="tag tag-blue">📍 위치등록 {withCoords.length}곳</span>
              {noCoords.length>0 && <span className="tag tag-orange">⚠️ 미등록 {noCoords.length}곳</span>}
            </div>
          </div>
          <div className="card" style={{overflow:"hidden",marginBottom:16}}>
            {loadError
              ? <div style={{height:520,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:12,background:"#fff8f8"}}>
                  <span style={{fontSize:40}}>⚠️</span>
                  <p style={{fontSize:14,color:"#dc2626",fontWeight:600}}>카카오맵 로드 실패</p>
                  <p style={{fontSize:12,color:"#64748b",textAlign:"center"}}>카카오 개발자 콘솔에서<br/>카카오맵 ON 여부 및 앱 키를 확인해주세요</p>
                </div>
              : !kakaoReady
                ? <div style={{height:520,display:"flex",alignItems:"center",justifyContent:"center",gap:10,color:"#64748b"}}>
                    <span style={{fontSize:20}}>🗺️</span> 지도 불러오는 중...
                  </div>
                : <div id="kakao-map" style={{width:"100%",height:520}}></div>
            }
          </div>
          {noCoords.length>0 && (
            <div className="card" style={{padding:20,background:"#fffbeb",border:"1px solid #fde68a"}}>
              <p style={{fontSize:13,fontWeight:600,color:"#92400e",marginBottom:10}}>⚠️ 지도 위치 미설정 — 수정 화면에서 주소 입력 후 📍 버튼을 눌러주세요</p>
              <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
                {noCoords.map(p=><span key={p.id} style={{fontSize:12,background:"#fff",border:"1px solid #fcd34d",borderRadius:20,padding:"3px 10px",color:"#78350f"}}>{p.buildingName||"이름없음"}</span>)}
              </div>
            </div>
          )}
        </div>
      );
    }

    /* ─── INFRA EDITOR ─── */
    function InfraEditor({ items, onChange }) {
      const [label, setLabel] = useState("");
      const [note,  setNote]  = useState("");
      const [open,  setOpen]  = useState(false);

      const add = (l=label) => {
        if (!l.trim()) return;
        onChange([...items, {id:uid(),label:l.trim(),note:l===label?note.trim():""}]);
        setLabel(""); setNote(""); setOpen(false);
      };
      const remove     = (id) => onChange(items.filter(i=>i.id!==id));
      const updateNote = (id,v) => onChange(items.map(i=>i.id===id?{...i,note:v}:i));
      const suggestions = INFRA_SUGGESTIONS.filter(s=>!items.find(i=>i.label===s)&&(!label||s.includes(label)));

      return (
        <div>
          {items.length>0 && (
            <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:12}}>
              {items.map(item=>(
                <div key={item.id} style={{display:"flex",gap:8,alignItems:"center",background:"#f8fafc",padding:"8px 12px",borderRadius:8,border:"1px solid #e8edf5"}}>
                  <span style={{fontWeight:600,fontSize:13,minWidth:80,color:"#334155"}}>{item.label}</span>
                  <input className="input-field" placeholder="메모 (선택)" value={item.note} onChange={e=>updateNote(item.id,e.target.value)} style={{flex:1,padding:"6px 10px",fontSize:13}} />
                  <button className="btn-icon" onClick={()=>remove(item.id)} style={{color:"#ef4444"}}>✕</button>
                </div>
              ))}
            </div>
          )}
          <div style={{position:"relative"}}>
            <div style={{display:"flex",gap:8}}>
              <input className="input-field" placeholder="항목 입력 (예: 마트, 공원...)" value={label}
                onChange={e=>{setLabel(e.target.value);setOpen(true);}} onFocus={()=>setOpen(true)}
                onKeyDown={e=>e.key==="Enter"&&add()} style={{flex:2}} />
              <input className="input-field" placeholder="메모 (선택)" value={note} onChange={e=>setNote(e.target.value)} onKeyDown={e=>e.key==="Enter"&&add()} style={{flex:2}} />
              <button className="btn-primary" onClick={()=>add()}>추가</button>
            </div>
            {open && suggestions.length>0 && (<>
              <div style={{position:"fixed",inset:0,zIndex:5}} onClick={()=>setOpen(false)} />
              <div style={{position:"absolute",top:"calc(100% + 6px)",left:0,right:0,background:"#fff",borderRadius:10,border:"1px solid #e2e8f0",boxShadow:"0 8px 28px rgba(0,0,0,.10)",zIndex:10,padding:12}}>
                <p style={{fontSize:11,color:"#94a3b8",marginBottom:8,fontWeight:600}}>추천 항목</p>
                <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
                  {suggestions.slice(0,14).map(s=>(
                    <button key={s} onClick={()=>{add(s);setOpen(false);}}
                      style={{padding:"4px 11px",border:"1px solid #e2e8f0",borderRadius:20,background:"#f8fafc",fontSize:12,cursor:"pointer",color:"#374151"}}>{s}</button>
                  ))}
                </div>
              </div>
            </>)}
          </div>
        </div>
      );
    }

    /* ─── PRICE CHART ─── */
    function PriceChart({ prop }) {
      const [loading,  setLoading]  = useState(false);
      const [txData,   setTxData]   = useState([]);
      const [error,    setError]    = useState("");
      const [fetched,  setFetched]  = useState(false);
      const chartRef = React.useRef(null);
      const chartInst = React.useRef(null);

      useEffect(() => {
        if (prop.dongCode && prop.dongCode.length===5 && IS_GOV_API) fetchData();
      }, []);

      const fetchData = async () => {
        if (!prop.dongCode || prop.dongCode.length !== 5) {
          setError("법정동코드(5자리)를 먼저 수정 화면에서 입력해주세요");
          return;
        }
        if (!IS_GOV_API) {
          setError("data.go.kr API 키를 index.html 상단 GOV_API_KEY에 입력해주세요");
          return;
        }
        setLoading(true); setError(""); setTxData([]);
        const results = [];
        const now = new Date();
        for (let i = 0; i < 36; i++) {
          const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
          const ym = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}`;
          try {
            const proxy = `https://corsproxy.io/?url=${encodeURIComponent(
              `https://apis.data.go.kr/1613000/RTMSDataSvcAptTradeDev/getRTMSDataSvcAptTradeDev?serviceKey=${GOV_API_KEY}&LAWD_CD=${prop.dongCode}&DEAL_YMD=${ym}&numOfRows=100&pageNo=1`
            )}`;
            const res = await fetch(proxy);
            const xml = await res.text();
            const parser = new DOMParser();
            const doc = parser.parseFromString(xml, "text/xml");
            const items = doc.querySelectorAll("item");
            items.forEach(item => {
              const name = item.querySelector("아파트")?.textContent?.trim() || "";
              const area = parseFloat(item.querySelector("전용면적")?.textContent || "0");
              const price = parseInt((item.querySelector("거래금액")?.textContent || "0").replace(/,/g,""));
              const year  = item.querySelector("년")?.textContent;
              const month = item.querySelector("월")?.textContent;
              if (name.includes(prop.buildingName.slice(0,4))) {
                results.push({ ym, year, month, area: Math.round(area/3.305), price: price/10000 });
              }
            });
          } catch(e) {}
        }
        results.sort((a,b)=>a.ym.localeCompare(b.ym));
        setTxData(results);
        setFetched(true);
        setLoading(false);
      };

      useEffect(() => {
        if (!fetched || txData.length===0 || !chartRef.current) return;
        if (chartInst.current) chartInst.current.destroy();
        const labels = [...new Set(txData.map(t=>`${t.year}.${String(t.month).padStart(2,"0")}`))];
        const avgByMonth = labels.map(lbl => {
          const items = txData.filter(t=>`${t.year}.${String(t.month).padStart(2,"0")}`===lbl);
          return Math.round(items.reduce((s,i)=>s+i.price,0)/items.length);
        });
        chartInst.current = new Chart(chartRef.current, {
          type:"line",
          data:{
            labels,
            datasets:[{
              label:"평균 실거래가 (만원)",
              data:avgByMonth,
              borderColor:"#1d4ed8",
              backgroundColor:"rgba(29,78,216,.08)",
              tension:0.3, fill:true,
              pointBackgroundColor:"#1d4ed8", pointRadius:4
            }]
          },
          options:{
            responsive:true, maintainAspectRatio:false,
            plugins:{ legend:{ display:false } },
            scales:{
              y:{ ticks:{ callback: v => v>=10000?`${Math.round(v/10000)}억`:v+"만" } },
              x:{ ticks:{ maxRotation:45 } }
            }
          }
        });
      }, [txData, fetched]);

      return (
        <div className="card" style={{padding:24,marginBottom:16}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
            <div>
              <p className="section-label" style={{marginBottom:4}}>실거래가 히스토리 (최근 3년)</p>
              {prop.dongCode ? <span className="tag tag-blue">법정동코드: {prop.dongCode}</span>
                : <span className="tag tag-orange">⚠️ 수정 화면에서 법정동코드 입력 필요</span>}
            </div>
            <button className="btn-secondary" onClick={fetchData} disabled={loading}
              style={{fontSize:13,padding:"8px 16px",opacity:loading?.6:1}}>
              {loading?"조회 중...":"🔄 새로고침"}
            </button>
          </div>
          {error && <p style={{color:"#dc2626",fontSize:13,marginBottom:12,padding:"10px 14px",background:"#fee2e2",borderRadius:8}}>{error}</p>}
          {!IS_GOV_API && !error && (
            <div style={{padding:"20px",background:"#f8fafc",borderRadius:10,border:"2px dashed #e2e8f0",textAlign:"center"}}>
              <p style={{fontSize:13,color:"#94a3b8",lineHeight:1.7}}>
                📋 <strong>data.go.kr</strong>에서 <strong>"아파트매매 실거래 상세 자료"</strong> API 키 발급 후<br/>
                index.html 상단 <code style={{background:"#f1f5f9",padding:"1px 6px",borderRadius:4}}>GOV_API_KEY</code> 에 입력하면 활성화됩니다
              </p>
            </div>
          )}
          {fetched && txData.length===0 && <p style={{color:"#94a3b8",fontSize:13,textAlign:"center",padding:"20px 0"}}>해당 아파트의 거래 데이터가 없습니다</p>}
          {fetched && txData.length>0 && (
            <div style={{height:280,position:"relative"}}><canvas ref={chartRef}></canvas></div>
          )}
          {fetched && txData.length>0 && (
            <div style={{marginTop:16,maxHeight:200,overflowY:"auto"}}>
              <p style={{fontSize:11,color:"#94a3b8",marginBottom:8}}>개별 거래 내역 ({txData.length}건)</p>
              {txData.map((t,i)=>(
                <div key={i} style={{display:"flex",justifyContent:"space-between",padding:"6px 0",borderBottom:"1px solid #f8fafc",fontSize:12}}>
                  <span style={{color:"#64748b"}}>{t.year}.{String(t.month).padStart(2,"0")}</span>
                  <span style={{color:"#374151"}}>{t.area}평</span>
                  <span style={{color:"#1d4ed8",fontWeight:600}}>{t.price.toLocaleString()}만원</span>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    /* ─── APARTMENT SEARCH ─── */
    function ApartmentSearch({ onSelect }) {
      const [q, setQ]           = useState("");
      const [results, setResults] = useState([]);
      const [loading, setLoading] = useState(false);
      const [open, setOpen]       = useState(false);

      const search = () => {
        if (!q.trim()) return;
        if (!window.kakao || !window.kakao.maps) { alert("카카오맵 로딩 중입니다. 잠시 후 다시 시도해주세요"); return; }
        setLoading(true);
        kakao.maps.load(() => {
          const ps = new kakao.maps.services.Places();
          ps.keywordSearch(q + " 아파트", (data, status) => {
            setLoading(false);
            if (status === kakao.maps.services.Status.OK) {
              setResults(data.slice(0, 6));
              setOpen(true);
            } else {
              setResults([]);
            }
          }, { size: 6 });
        });
      };

      const pick = (r) => {
        const addr = r.road_address_name || r.address_name;
        onSelect({
          buildingName: r.place_name.replace(/\s*아파트$/, ""),
          address: addr,
          lat: parseFloat(r.y),
          lng: parseFloat(r.x),
          dongCode: getDongCode(addr),
        });
        setQ(""); setResults([]); setOpen(false);
      };

      return (
        <div style={{position:"relative"}}>
          <div style={{display:"flex",gap:8}}>
            <input className="input-field" placeholder="🔍 아파트명으로 검색" value={q}
              onChange={e=>setQ(e.target.value)} onKeyDown={e=>e.key==="Enter"&&search()} style={{flex:1}} />
            <button className="btn-secondary" onClick={search} style={{flexShrink:0,padding:"10px 16px",fontSize:13}}>
              {loading ? "검색중..." : "검색"}
            </button>
          </div>
          {open && results.length>0 && (<>
            <div style={{position:"fixed",inset:0,zIndex:5}} onClick={()=>setOpen(false)} />
            <div style={{position:"absolute",top:"calc(100%+6px)",left:0,right:0,background:"#fff",borderRadius:10,border:"1px solid #e2e8f0",boxShadow:"0 8px 28px rgba(0,0,0,.12)",zIndex:10,overflow:"hidden"}}>
              {results.map(r=>(
                <div key={r.id} onClick={()=>pick(r)}
                  style={{padding:"12px 16px",cursor:"pointer",borderBottom:"1px solid #f8fafc",transition:"background .15s"}}
                  onMouseEnter={e=>e.currentTarget.style.background="#f8fafc"}
                  onMouseLeave={e=>e.currentTarget.style.background="#fff"}>
                  <p style={{fontWeight:600,fontSize:13,color:"#0f172a"}}>{r.place_name}</p>
                  <p style={{fontSize:11,color:"#64748b",marginTop:2}}>{r.road_address_name||r.address_name}</p>
                </div>
              ))}
            </div>
          </>)}
        </div>
      );
    }

                          if (status === kakao.maps.services.Status.OK) {
                            set("lat", parseFloat(result[0].y));
                            set("lng", parseFloat(result[0].x));
                            alert("📍 위치 설정 완료!");
                          } else {
                            alert("주소를 찾을 수 없어요. 더 자세히 입력해보세요.");
                          }
                        });
                      });
                    }}>
                    {form.lat ? "📍 위치완료" : "📍 위치설정"}
                  </button>
                </div>
                {form.lat && <p style={{fontSize:11,color:"#16a34a",marginTop:4,fontWeight:600}}>✅ 지도 좌표 설정됨 ({form.lat.toFixed(4)}, {form.lng.toFixed(4)})</p>}
              </div>
              <div><LBL>평수 (전용면적)</LBL><input className="input-field" placeholder="예: 34" value={form.size} onChange={e=>set("size",e.target.value)} /></div>
              <div>
                <LBL>준공년도</LBL>
                <input className="input-field" placeholder="예: 2010" value={form.constructionYear} onChange={e=>set("constructionYear",e.target.value)} />
                {form.constructionYear && parseInt(form.constructionYear)>1900 && (
                  <p style={{fontSize:11,color:"#64748b",marginTop:4}}>{new Date().getFullYear()-parseInt(form.constructionYear)}년차</p>
                )}
              </div>
              <div>
                <LBL>법정동코드 (5자리) {form.dongCode && <span style={{color:"#16a34a",fontWeight:500}}>✅ 자동감지됨</span>}</LBL>
                <input className="input-field" placeholder="아파트 검색 시 자동 입력 · 예: 11680"
                  value={form.dongCode}
                  onChange={e=>set("dongCode", e.target.value.replace(/[^0-9]/g,"").slice(0,5))} />
                <p style={{fontSize:11,color:"#94a3b8",marginTop:4}}>
                  검색으로 자동감지 안되면 → <a href="https://www.code.go.kr/stdcode/regCodeL.do" target="_blank" rel="noreferrer" style={{color:"#3b82f6"}}>코드 직접 조회</a>
                </p>
              </div>
              <div>
                <LBL>가격 (만원 단위)</LBL>
                <input className="input-field" placeholder="예: 120000 → 12억원" value={form.price} onChange={e=>set("price",e.target.value.replace(/[^0-9]/g,""))} />
                {form.price && <p style={{fontSize:12,color:"#1d4ed8",marginTop:5,fontWeight:600}}>= {formatPrice(form.price)}</p>}
              </div>
              <div><LBL>인근역</LBL><input className="input-field" placeholder="예: 강남역 도보 10분" value={form.nearbyStation} onChange={e=>set("nearbyStation",e.target.value)} /></div>
            </div>
          </div>

          <div className="card" style={{padding:26,marginBottom:16}}>
            <p className="section-label">주변 및 인프라</p>
            <InfraEditor items={form.infrastructure} onChange={v=>set("infrastructure",v)} />
          </div>

          <div className="card" style={{padding:26,marginBottom:16}}>
            <p className="section-label">사진 / 영상 (구글 드라이브 링크)</p>
            <MediaEditor items={form.mediaLinks} onChange={v=>set("mediaLinks",v)} />
          </div>

          <div className="card" style={{padding:26,marginBottom:28}}>
            <p className="section-label">메모 / 기타</p>
            <textarea className="textarea-field" placeholder="추가적인 인상, 단점, 특이사항 등을 자유롭게 적어주세요"
              value={form.memo} onChange={e=>set("memo",e.target.value)} style={{minHeight:130}} />
          </div>

          <div style={{display:"flex",gap:12,justifyContent:"flex-end"}}>
            <button className="btn-secondary" onClick={onCancel}>취소</button>
            <button className="btn-primary" onClick={handleSave} style={{padding:"10px 36px"}}>{initial?"수정 완료":"저장하기"}</button>
          </div>
        </div>
      );
    }

    /* ─── MAIN APP ─── */
    function App() {
      const [auth,        setAuth]        = useState(false);
      const [properties,  setProperties]  = useState([]);
      const [view,        setView]        = useState("list");
      const [selected,    setSelected]    = useState(null);
      const [editing,     setEditing]     = useState(null);
      const [sidebarOpen, setSidebarOpen] = useState(false);
      const [isMobile,    setIsMobile]    = useState(false);
      const [myIp,        setMyIp]        = useState("");
      const [adminOpen,   setAdminOpen]   = useState(false);

      useEffect(() => {
        const mq = window.matchMedia("(max-width: 900px)");
        setIsMobile(mq.matches);
        const h = (e) => setIsMobile(e.matches);
        mq.addEventListener("change", h);
        return () => mq.removeEventListener("change", h);
      }, []);

      /* IP 트래킹 */
      useEffect(() => {
        if (!auth) return;
        fetch("https://api.ipify.org?format=json")
          .then(r => r.json())
          .then(({ ip }) => {
            setMyIp(ip);
            if (!window.IS_FB) return;
            const safeIp = ip.replace(/\./g, "_");
            window.db.collection("visitors").doc(safeIp).get().then(doc => {
              if (!doc.exists) {
                const name = window.prompt("👋 처음 오셨네요! 이름을 입력해주세요:") || "익명";
                window.db.collection("visitors").doc(safeIp).set({
                  ip, name, firstVisit: new Date().toISOString(),
                  lastVisit: new Date().toISOString(), visits: 1
                });
              } else {
                window.db.collection("visitors").doc(safeIp).update({
                  lastVisit: new Date().toISOString(),
                  visits: firebase.firestore.FieldValue.increment(1)
                });
              }
            });
          }).catch(() => {});
      }, [auth]);

      /* Data loading */
      useEffect(() => {
        if (!auth) return;

        if (!window.IS_FB) {
          setProperties(lsGet());
          return;
        }

        const unsub = window.db.collection("properties")
          .orderBy("createdAt", "desc")
          .onSnapshot(snap => {
            setProperties(snap.docs.map(d => ({ ...d.data(), id: d.id })));
          }, err => console.error("Firestore error:", err));

        return () => unsub();
      }, [auth]);

      /* CRUD */
      const saveProp = async (prop) => {
        if (!window.IS_FB) {
          const next = editing
            ? properties.map(p => p.id===prop.id ? prop : p)
            : [prop, ...properties];
          setProperties(next);
          lsSet(next);
        } else {
          await window.db.collection("properties").doc(prop.id).set(prop);
        }
        if (editing) { setSelected(prop); setView("detail"); }
        else { setView("list"); }
        setEditing(null);
      };

      const deleteProp = async (id) => {
        if (!window.IS_FB) {
          const next = properties.filter(p => p.id!==id);
          setProperties(next);
          lsSet(next);
        } else {
          await window.db.collection("properties").doc(id).delete();
        }
        setSelected(null);
        setView("list");
      };

      const go = (v) => { setView(v); setSelected(null); setEditing(null); };

      if (!auth) return <PasswordGate onSuccess={()=>setAuth(true)} />;

      return (
        <div style={{display:"flex",minHeight:"100vh"}}>
          <FontLoader />

          {/* 데스크탑 사이드바 */}
          <div className="sidebar-col" style={{background:"#0c1829"}}>
            <Sidebar view={view} setView={go} count={properties.length}
              onAdd={()=>{setEditing(null);setView("form");}} onClose={()=>{}} />
          </div>

          {/* 모바일 오버레이 사이드바 */}
          {sidebarOpen && <>
            <div className="mob-overlay" onClick={()=>setSidebarOpen(false)} />
            <div className="mob-sidebar">
              <button onClick={()=>setSidebarOpen(false)} style={{alignSelf:"flex-end",background:"transparent",border:"none",color:"#94a3b8",fontSize:22,cursor:"pointer",marginBottom:8}}>✕</button>
              <Sidebar view={view} setView={v=>{go(v);setSidebarOpen(false);}} count={properties.length}
                onAdd={()=>{setEditing(null);setView("form");setSidebarOpen(false);}} onClose={()=>setSidebarOpen(false)} />
            </div>
          </>}

          <main className="main-col">
            {/* 모바일 상단 바 */}
            <div className="mob-topbar">
              <button onClick={()=>setSidebarOpen(true)} style={{background:"transparent",border:"none",color:"#fff",fontSize:22,cursor:"pointer",lineHeight:1,padding:4}}>☰</button>
              <span style={{color:"#fff",fontWeight:700,fontSize:15,flex:1}}>🏠 임장 히스토리</span>
              <button onClick={()=>{setEditing(null);setView("form");}} style={{background:"#1d4ed8",color:"#fff",border:"none",borderRadius:8,padding:"7px 14px",fontSize:13,fontWeight:600,cursor:"pointer"}}>+ 추가</button>
            </div>
            {view==="list" && <ListView properties={properties} onSelect={p=>{setSelected(p);setView("detail");}} onEdit={p=>{setEditing(p);setView("form");}} onDelete={id=>deleteProp(id)} onAdd={()=>{setEditing(null);setView("form");}} />}
            {view==="map"  && <MapView properties={properties} />}
            {view==="admin" && <AdminView onBack={()=>setView("list")} myIp={myIp} />}
            {view==="detail" && selected && <DetailView prop={selected} onEdit={()=>{setEditing(selected);setView("form");}} onDelete={()=>deleteProp(selected.id)} onBack={()=>go("list")} />}
            {view==="form" && <PropertyForm initial={editing} onSave={saveProp} onCancel={()=>{setEditing(null);setView(editing?"detail":"list");}} />}
          </main>
        </div>
      );
    }

    function MobilePreviewWrapper() {
      if (!MOBILE_PREVIEW) return <App />;
      return (
        <div style={{minHeight:"100vh",background:"#1a1a2e",display:"flex",alignItems:"flex-start",justifyContent:"center",padding:"40px 20px",gap:20}}>
          <div style={{position:"sticky",top:40}}>
            <p style={{color:"#94a3b8",fontSize:12,marginBottom:8,textAlign:"center"}}>갤럭시 S25 미리보기</p>
            <div style={{width:360,height:780,border:"8px solid #333",borderRadius:40,overflow:"hidden",boxShadow:"0 24px 64px rgba(0,0,0,.5)",background:"#fff",position:"relative"}}>
              <div style={{position:"absolute",top:0,left:"50%",transform:"translateX(-50%)",width:80,height:8,background:"#333",borderRadius:"0 0 8px 8px",zIndex:10}}></div>
              <div style={{width:"100%",height:"100%",overflowY:"auto",overflowX:"hidden"}}>
                <App />
              </div>
            </div>
            <p style={{color:"#475569",fontSize:11,textAlign:"center",marginTop:12}}>360 × 780 px</p>
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<MobilePreviewWrapper />);
  </script>
</body>
</html>
